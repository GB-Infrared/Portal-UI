<!doctype html>
<!-- THIS SCREEN IS LIGHT, AND IT HAS NO DARK.

     It used to be pinned to the portal's dark theme and argued for as a void:
     a room you sat in, with stars and an aurora behind the globe. That has been
     dropped. The portal has one final palette, this screen uses it, and the
     theme it uses is the light one - so there is no attribute pinned here at
     all any more. The light values are the ones :root already carries, and the
     dark block that used to override them has been deleted rather than left
     switched off, because a dead theme is a theme somebody will eventually turn
     back on by accident.

     The stars and the aurora went with it, and they were not simply scenery
     that no longer matched. They were NIGHT, and this screen is now a picture
     of a sunlit Earth with a real terminator drawn across it. Stars behind a
     daylight globe would have been the background disagreeing with the subject.
     What is behind it instead is the sun: a warm wash from above, a cool sky
     below, which is the only ambience a solar portal actually needs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS · Site Overview</title>
<link rel="icon" href="logo/favicon.png">
<style>

/* ---- THE FIELD IS SPACE. THE INSTRUMENT IS NOT. ----
   Two decisions, and they are separate on purpose.

   BEHIND the glass there is a void, because the subject is a photograph of the
   Earth taken from orbit and the correct background for that is the thing that
   is actually behind it. A white field around a lit planet reads as a picture
   pasted into a document.

   The INSTRUMENT - the bar, the cards, the strip - stays on the portal's light
   palette, exactly as every other screen in the product. It is the same
   application; a reader arriving here from Monitoring should not have to
   re-learn what a panel looks like because the wallpaper changed. So these are
   the portal's LIGHT tokens, unchanged, and the panels sit on the void the way
   a lit console sits in a dark room.

   Everything painted on the VOID itself - the stars, the gravity grid, the
   vignette - is written in literals rather than tokens, precisely because it is
   not part of the light surface and must not follow it. */
:root{
  /* ---- LIGHT · UTILITY BLUE (default) · enterprise solar-portal palette ---- */
  --bg:#f1f4f8;            /* page background            */
  --panel:#ffffff;         /* card surface               */
  --panel-2:#f5f8fb;       /* nested surface / inputs    */
  --line:#dde4ec;          /* card borders               */
  --line-soft:#e9eef4;     /* gridlines, dividers        */
  --line-hi:#b5c2d1;       /* hover / active borders     */
  --text:#152234;          /* primary text               */
  --muted:#5a6b7f;         /* secondary text             */
  --faint:#8494a6;         /* tertiary text              */
  --dim:#aab6c4;           /* dead readouts (offline)    */
  --elev:#ffffff;          /* tooltips, toasts           */
  --sel:#e8f0fb;           /* selected card surface      */
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);
  /* the row under the pointer, and only that row */
  --row-hover:rgba(11,99,206,.10);
  --shadow:rgba(4,10,20,.55);   /* a panel on the void casts into the void */
  --on-accent:#ffffff;     /* text on a filled accent    */
  /* header bar — same surface family as the cards */
  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;         /* producing / healthy        */
  --green-rgb:18,161,80;   /* same green, for rgba() glows */
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;           /* offline / alarms           */
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;         /* yield / deviations         */
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;         /* wordmark · gold            */
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}
/* ---- DARK · same hues on navy. Only the base tokens are redefined; the
   header/brand tokens above reference them, so they follow automatically. ---- */
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:#070c14;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* =====================================================================
   SELECT A SITE — the room between the sign-in and the portal.

   Signing in used to drop you straight onto one plant's Home, which meant
   the portfolio was something you discovered afterwards from a dropdown.
   This makes the portfolio the first thing you see: every site standing
   where it actually stands, and the portal opens on whichever one you pick.

   It continues the sign-in rather than starting something new — same void,
   same stars, same aurora, same corner brackets — so signing in and choosing
   a site read as one arrival instead of two screens that happen to follow
   each other.

   THIS WAS A RING, AND THE RING WAS WRONG. Sites used to sit evenly around
   an orbit, and the comment here defended that by saying a geography would be
   an invented fact. That was only true of a portfolio with no addresses. Every
   site in this one IS a place — Sangria in Hanumangarh, Rioja at Bikaner,
   Mendoza out past Jaisalmer — so the ring was not avoiding an invention, it
   was throwing away the one attribute that tells these sites apart. Distance
   is the operational fact of a fleet: it decides which crew goes, how long
   they are on the road, and whether one storm front is about to take out three
   sites or one. A ring cannot say any of that. A map says all of it for free.

   WHAT THE PICTURE ENCODES, and it is only these four things:
     POSITION   where the site is. Real latitude and longitude, projected;
                nothing is nudged for looks except demo sites that share a
                town, and those say so where they are built.
     SIZE       AC capacity. The biggest site is the biggest node.
     COLOUR     health, and health only: green producing, amber a warning,
                red a critical alarm, grey nothing coming in. Warm anywhere
                on this map means somebody has to look at something.
     BRIGHTNESS output against the site's own nameplate.
   So a fleet at midday glows and the same fleet at midnight goes quiet without
   a single number being read — and now you can also see that the warm one is
   the far one.

   The core went with the ring. A glowing portfolio total in the middle of the
   frame was honest over an orbit, where the centre meant "the sum"; over a map
   the centre is a point in Nagaur district, and parking the fleet total there
   would invent exactly the fact the old comment was afraid of. The total moved
   to a plate in the corner, where it is a readout and not a location.
   ===================================================================== */
html,body{height:100%}
/* ---------- the field ----------
   One lit navy pool behind the content, falling off to --bg at the edges. The
   portal never shows a flat background either: it is always cards lifted off a
   base, and that separation is what makes it look like itself.

   The pool is re-mixed for the lifted ramp. It is not a decorative value: it is
   chosen so the centre of the field lands just above --panel, which is what
   makes a card read as sitting ON something rather than floating in it. Over
   the old #0a1017 the same ink landed at about #1a2840; over #121a26 it takes a
   lighter ink to arrive at the equivalent place, and pasting the old numbers
   onto the new ramp would have left the middle of the screen reading DARKER
   than the cards on top of it. */
/* THE SOLAR BACKGROUND.
   Two washes and the base. A warm one from the top, which is the sun; a cool
   one low and wide, which is the sky it is shining through. Neither is strong
   enough to be a colour you would name - together they are the difference
   between a page that is white and a page that is daylit, and daylight is the
   correct ambience for a screen whose whole subject is where the sun currently
   is. The globe sits in it rather than on it. */
/* ---------- THE VOID, AND THE SUN IN IT ----------
   Deep space, two cold nebulae so the black is not a flat fill, and one warm
   wash that is the SUN - parked where the sun actually is. The frame loop hands
   the page the screen position of the subsolar point every time it moves, so
   the light falling across this screen arrives from the same direction as the
   terminator drawn on the globe. Turn the world and the daylight travels with
   it. A glow pinned to a corner would have been the background disagreeing with
   the subject, which is the one thing this screen may not do.

   The starfield is NOT here. It is drawn on the canvas with the gravity grid,
   because both of them are bent by the Earth and a CSS gradient cannot be. */
/* AND IT GOES OUT WHEN THE SUN DOES.
   --sun-x/--sun-y say WHERE the sun is; --day says whether it is on our side of
   the world at all. It is 1 with the sun behind the reader and the whole disc
   lit, and 0 with the sun round the back and the reader looking at the night
   side - which is a real state of this screen, reached by dragging the globe or
   simply by waiting. The warm wash and the corona are multiplied by it, so they
   leave WITH the daylight instead of burning over a dark planet; a cold field
   comes up by exactly as much as they go, so the void gets deeper and bluer
   rather than merely dimmer. The stars brighten in the same breath - see
   drawSpace - because the thing that hides them is glare, and the glare has
   gone. Nothing here is a mood: it is the same sun the terminator is drawn
   from, said in the background. */
body{background:
    radial-gradient(circle 38vmax at var(--sun-x,80%) var(--sun-y,12%),
      rgba(255,216,146,calc(.26*var(--day,1))) 0%,
      rgba(240,178,73,calc(.09*var(--day,1))) 30%, transparent 62%),
    /* THE NEBULAE TRAVEL. They were pinned to two corners of the viewport,
       which is what a wallpaper does. They are deep sky: they belong to the
       sky, not to the window. --neb1/--neb2 are those same two points solved
       back into world coordinates once and then projected through the camera
       every frame, so they open exactly where they always sat and then sweep
       when the globe is turned. And they come UP at night rather than going
       out with the daylight - the same argument the stars are drawn on, which
       is that the thing hiding them is glare. */
    radial-gradient(ellipse 72% 62% at var(--neb1-x,16%) var(--neb1-y,86%),
      rgba(47,208,122,calc((.045 + .035*(1 - var(--day,1)))*var(--neb1-o,1))) 0%, transparent 62%),
    radial-gradient(ellipse 82% 70% at var(--neb2-x,86%) var(--neb2-y,20%),
      rgba(90,162,240,calc((.05 + .045*(1 - var(--day,1)))*var(--neb2-o,1))) 0%, transparent 60%),
    /* the wide one, and it is what makes NOON legible. With the sun dead behind
       the reader the tight wash above lands where the globe already is and is
       never seen; this one is 140% of the frame from the same anchor, so a
       fully lit face sits in a field that has been lifted everywhere rather
       than in the same black it would have at midnight.

       It carries most of the day/night swing, and it used to be too polite to
       do it: at .115 the difference between noon and midnight in the corner of
       this screen was about eight values out of 255, which is a thing that is
       true of the markup and not true of the picture. A background keyed to
       the sun that nobody can see move is not keyed to the sun. */
    radial-gradient(ellipse 150% 130% at var(--sun-x,80%) var(--sun-y,12%),
      rgba(126,158,214,calc(.30*var(--day,1))) 0%,
      rgba(90,120,180,calc(.14*var(--day,1))) 45%, transparent 78%),
    /* the night field: deep, cold, and worth exactly what the daylight is not */
    radial-gradient(ellipse 120% 96% at 50% 48%,
      rgba(4,10,24,calc(.92*(1 - var(--day,1)))) 0%,
      rgba(0,1,5,calc(1 - var(--day,1))) 100%),
    #070c14;
  color:var(--muted);font-family:var(--mono);overflow:hidden}

/* the corona. Same anchor point as the wash, so the light has one source
   instead of two that nearly agree. */
.rays{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:calc(.6*var(--day,1));
  background:repeating-conic-gradient(from 0deg at var(--sun-x,80%) var(--sun-y,12%),
    rgba(255,226,170,.17) 0deg 1.2deg, transparent 1.2deg 7.5deg);
  -webkit-mask-image:radial-gradient(circle 32vmax at var(--sun-x,80%) var(--sun-y,12%),
    rgba(0,0,0,.95) 0%, transparent 58%);
  mask-image:radial-gradient(circle 32vmax at var(--sun-x,80%) var(--sun-y,12%),
    rgba(0,0,0,.95) 0%, transparent 58%)}

/* A vignette on a light page cannot be a shadow at the edges - that is how you
   get a white screen with dirty corners. It is a WARM one instead, the light
   falling off towards the frame, which reads as depth rather than as grime. */
/* On a light page a vignette had to be warm, or you got a white screen with
   dirty corners. In the void it is what it has always been: the frame falling
   off into the dark, so the eye is handed the middle. */
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%, transparent 54%,
    rgba(2,5,10,calc(.70 + .24*(1 - var(--day,1)))) 100%)}
/* the faint horizontal ruling of a CRT, at the edge of visibility - it is what
   makes the black read as a screen rather than as absence */
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#0f1a28 2px 3px)}
.corner{position:fixed;width:26px;height:26px;z-index:4;pointer-events:none}
.corner.tl{top:16px;left:16px;border-top:1px solid rgba(var(--green-rgb),.42);border-left:1px solid rgba(var(--green-rgb),.42)}
.corner.br{bottom:16px;right:16px;border-bottom:1px solid rgba(var(--green-rgb),.42);border-right:1px solid rgba(var(--green-rgb),.42)}

/* ---------- header ---------- */
/* A LIT PANEL IN A DARK ROOM. On a light page a 62%-opaque white bar was a
   tint; over the void it would be a grey smear with stars showing through the
   type. It is nearly solid here, and what lifts it off the field is the shadow
   underneath rather than the transparency. */
.hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:22px;
  height:62px;padding:0 20px;font-size:11px;color:var(--faint);
  background:color-mix(in srgb, var(--panel) 93%, transparent);
  box-shadow:0 10px 34px rgba(0,0,0,.42);
  border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hud .mark{display:flex;align-items:center;gap:11px;padding-right:24px;flex:none}
.hud .mark img{height:30px;width:auto;display:block;flex:none}
.hud .word{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--brand);letter-spacing:.2px;
  line-height:1.05;display:block}
.hud .sub{font-size:9px;letter-spacing:.28em;color:var(--faint);text-transform:uppercase;
  display:block;margin-top:3px}
/* The headline numbers live IN the bar rather than in a panel on the field.
   A panel beside the map is a second thing competing for the same glance; a
   bar above it is the frame the picture is read inside. */
.hud .cell{display:flex;flex-direction:column;justify-content:center;gap:6px;flex:none;
  height:100%;padding:0 20px;border-left:1px solid var(--line)}
.hud .cell .k{font-size:9px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;
  white-space:nowrap}
.hud .cell .v{font-size:12.5px;letter-spacing:.04em;color:var(--text);line-height:1;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.hud .cell .v small{font-size:.8em;color:var(--faint);letter-spacing:.14em;margin-left:5px}
.hud .right{margin-left:auto;display:flex;align-items:center;height:100%;flex:none}
.hud .right .cell:first-child{border-left:1px solid var(--line)}
@keyframes lv{0%,100%{opacity:1}50%{opacity:.3}}
.hud .out{background:none;border:1px solid var(--line);border-radius:6px;color:var(--faint);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;padding:8px 15px;margin-left:20px}
.hud .out:hover{color:var(--red);border-color:rgba(255,107,107,.5)}
/* the cells fold from the least load-bearing end inward rather than wrapping */
/* Measured against the widest each cell actually gets, not guessed: at 17px
   the five cells plus the mark and the right-hand block need about 1430px, and
   each fold buys back roughly its own cell. Folding earlier than that throws
   away a number the screen had room for. */
@media (max-width:1400px){ .hud .cell.c4{display:none} }
@media (max-width:1280px){ .hud .cell.c3{display:none} }
@media (max-width:1160px){ .hud .cell.c2{display:none} }

/* ---------- the theatre ---------- */
/* The globe owns everything between the bar and the rail. The canvas measures
   its own parent, so moving these four numbers is the whole of moving the
   globe: the sphere is sized to the box, and every label follows from it. */
/* The globe now has the whole window. It used to stop 360px short for the
   right-hand panel; with the panel gone, leaving the gap would be leaving a
   margin around nothing. */
/* FULL BLEED. The space goes behind the bar and behind the strip, because a
   starfield that stops in a straight line 62px down is a wallpaper, not a view.
   The bar and the strip float ON it, and the GLOBE is centred on what is left
   between them - see size(), which is the only place that offset lives. */
.theatre{position:fixed;inset:0;z-index:5}
/* grab, not crosshair: the world turns under the pointer, and the cursor is the
   only thing on screen that can say so before you try it */
/* the photograph sits under the instrument and takes no clicks - every gesture
   on this screen belongs to the layer above it */
#earth{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#atlas{cursor:grab}
#atlas:active{cursor:grabbing}

#atlas{position:absolute;inset:0;width:100%;height:100%}

/* The rule used to name .clk, which nothing on the page has ever carried, so
   the clock stayed and pushed the way out off the edge of a narrow screen.
   THE LIVE PIP IS GONE FROM THE BAR. There is one on the strip, over figures
   that are actually moving; a second one beside the operator's own name was a
   light announcing that a name was live. */
@media (max-width:860px){ .hud .lc{display:none} }

/* ---------- undo a spread ----------
   The only thing left in the bottom-left corner now that the hint and the
   portfolio plate have gone. It appears solely while a site has been dragged
   off its true position, which makes it self-explaining: it is never on screen
   except right after the action it undoes. */
.reset{position:absolute;left:26px;bottom:26px;z-index:7;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  color:var(--muted);background:color-mix(in srgb, var(--panel) 70%, transparent);
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  transition:color .2s,border-color .2s}
.reset:hover{color:var(--text);border-color:var(--line-hi)}
.reset[hidden]{display:none}
@media (max-width:1100px){ .reset{bottom:20px;left:20px} }

/* ---------- a site, as a NAMEPLATE AND A READOUT ----------
   A real <button> over the canvas rather than a shape drawn into it: the canvas
   could render a hundred sites beautifully and not one of them would be
   reachable by keyboard, focusable, or readable aloud. The picture is the
   canvas; the CONTROL is always HTML.

   IT IS TWO PLATES, NOT ONE, AND THE SPLIT IS THE POINT.

   As one box, the site's NAME was a header row: the first line of a card, in
   the same rectangle as its numbers, doing the same job as the labels beside
   them. But the name is not one of the readings. It is what all of them are
   ABOUT - the answer to "whose numbers are these" - and on a screen whose only
   question is "which site", that answer should not be filed inside the reply.

   So the name comes out onto a plate of its own, stepped down and towards the
   world, joined back to the readout by a drawn elbow. Three things follow:
     - the LEADER from the globe now lands on the NAME, which is the thing it
       is actually naming, instead of on the corner of a table of numbers;
     - the name plate is small, high-contrast and always the same size, so a
       column of them reads as a list of sites you can scan;
     - the readout above it is free to be nothing but numbers.
   It is how an instrument is labelled and how a callout on a drawing works: the
   tag sits on the line, the detail sits behind it.

   WHY THE POSITION NEVER MOVES. The globe turns - on a drag, on the idle drift,
   on the sun. If a card is placed relative to its node, every card on screen
   crawls, and a number that is crawling is a number you re-find rather than
   read. So the plates are pinned to two fixed columns, one a side, and only the
   LEADER moves: a line is exactly the thing that can point at a moving target
   without moving itself. Slots are assigned once, from the portfolio - which
   side by longitude, which rank by latitude - so a card holds its place for the
   life of the screen and no two can ever collide. */
.chip{position:absolute;z-index:7;width:246px;box-sizing:border-box;
  display:block;padding:0 0 64px 0;background:none;border:none;
  font-family:var(--mono);text-align:left;white-space:nowrap;
  /* the card itself is not a control any more - only the nameplate in it is */
  cursor:default;transition:opacity .25s}
.chip.r{transform:translate(0,-50%)}
.chip.l{transform:translate(-100%,-50%)}

/* both plates are the same object: a lit panel in a dark room, lifted by the
   shadow it casts INTO the void rather than by a hairline nobody can see
   against black */
.chip .det,.chip .name{
  background:color-mix(in srgb, var(--panel) 96%, transparent);
  border:1px solid var(--line);border-radius:9px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:border-color .2s,box-shadow .2s}

/* ---- the readout ---- */
.chip .det{position:relative;z-index:2;padding:10px 12px 11px;
  display:flex;flex-direction:column;gap:7px}
.chip .rd{display:flex;align-items:baseline;gap:5px}
.chip .val{font-size:21px;line-height:1;letter-spacing:.01em;color:var(--green-deep);
  font-variant-numeric:tabular-nums}
.chip .u{font-size:10px;letter-spacing:.16em;color:var(--faint)}
/* Output ALONE cannot be compared across sites of different sizes, so the share
   of nameplate rides beside it: 414 kW at Mendoza and 227 kW at Rioja are two
   sites working about equally hard, and only the percentage says so. And the
   nameplate rides beside THAT, because a percentage with no denominator on
   screen is a number you have to take on trust. */
.chip .pc{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .pcc{color:var(--faint);font-size:.88em;margin-left:4px}
.chip .tr{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.chip .tr i{display:block;height:100%;width:0;border-radius:2px;background:var(--green);
  transition:width .8s ease-out}
/* four facts in two ruled columns. The same four in two flex rows read as a
   paragraph you have to parse; ruled into cells they read as a table you can
   scan, and the same fact is in the same place on every card in the column. */
.chip .gr{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);
  border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.chip .gr .c{display:flex;flex-direction:column;gap:3px;padding:6px 9px;min-width:0;
  border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.chip .gr .c:nth-child(2n){border-right:none}
.chip .gr .c:nth-child(n+5){border-bottom:none}


/* the alarm count in words as well as on the pip: the pip is the SEVERITY at a
   glance, this is the number in the same table as everything else it has to be
   weighed against */
.chip .gr b.warn{color:var(--amber)}
.chip .gr b.crit{color:var(--red)}
.chip .gr b.none{color:var(--faint);letter-spacing:.12em;font-weight:500}
.chip .gr i{font-style:normal;font-size:8.5px;letter-spacing:.18em;color:var(--faint)}
.chip .gr b{font-size:11px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis}
/* DAY / NIGHT in words. The terminator shows it for the whole world at a
   glance; this says it for THIS site without anyone having to judge which side
   of a curve a dot is on. */
.chip .gr b.night{color:var(--muted)}

/* ---- the tie between the two plates ----
   Two borders on one box, so the corner is a real corner rather than two rules
   that have to be kept touching. It runs down out of the readout and across
   into the side of the name, arriving level - the same way the leader arrives
   at the name from the other side, so the whole assembly is one line entering
   and one line leaving. */
/* The colour is written into each shorthand rather than once on the box above.
   `border-left:1px solid` is the full shorthand: it resets the colour it does
   not name to currentColor, which on the void is the page's ink and effectively
   invisible - the elbow was there and could not be seen. */
.chip .elb{position:absolute;z-index:1;bottom:22px;height:42px;pointer-events:none}
.chip.l .elb{left:22px;right:66%;
  border-left:1px solid var(--line-hi);border-bottom:1px solid var(--line-hi);
  border-bottom-left-radius:8px}
.chip.r .elb{right:22px;left:66%;
  border-right:1px solid var(--line-hi);border-bottom:1px solid var(--line-hi);
  border-bottom-right-radius:8px}

/* ---- the nameplate ----
   Stepped down and towards the world, so the leader reaches the name without
   crossing the readout. Its width is fixed rather than fitted, because a column
   of tags that all end on the same line reads as a list and a column of tags
   that each stop where their word did reads as debris.

   The ADDRESS IS NOT ON THIS PLATE. It used to be, and it did not fit: the
   nameplate is 66% of a 246px card, so every address longer than about twenty
   characters was printed as a fragment and an ellipsis. Half an address is not
   a shorter address, it is a different one - "Plot 14, Bikaner Road, B..."
   answers nothing at all. It now rides in the readout above, at the card's full
   width, and the nameplate carries the NAME alone, which is what a nameplate is
   for. See .site. */
.chip .name{position:absolute;bottom:0;z-index:2;width:66%;min-height:44px;
  display:flex;align-items:center;overflow:hidden;
  /* it IS the button: everything a UA puts on one is reset, and the pointer is
     the only thing on this card that says a click will do something */
  padding:0;font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.chip.l .name{right:0;flex-direction:row-reverse}
.chip.r .name{left:0;flex-direction:row}
.chip .nlab{flex:1;min-width:0;padding:8px 10px;display:flex;flex-direction:column;
  justify-content:center}
/* the spine is on the edge the leader arrives at: it catches the line, and it
   carries the site's state at plate size rather than as a 7px dot */
.chip .spine{width:4px;flex:none;align-self:stretch;background:var(--green)}
.chip .nm{min-width:0;font-size:12.5px;letter-spacing:.15em;color:var(--text);
  font-weight:700;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.chip.l .nlab{text-align:right}

/* ---- WHERE THE SITE IS, under what it is doing ----
   Ruled off from the figures rather than filed among them, because it is not a
   reading: nothing about it changes between now and tomorrow, and a fact that
   never moves sitting in a row of ones that move every second reads as a number
   you have stopped believing. It is the last thing on the readout and the name
   is the first thing under it, so "which site" is answered by one block - the
   address, then the elbow, then the name the leader lands on.

   It gets TWO LINES and it wraps into them. The rest of this card is nowrap
   because a wrapped figure is a broken figure; an address is prose and the only
   wrong way to set it is to cut it in half. Two lines hold every address in the
   portfolio; anything longer is clamped, which is a real limit rather than the
   accident of a plate that happened to be 162px wide. */
.chip .site{display:flex;align-items:flex-start;gap:7px;
  padding-top:8px;border-top:1px solid var(--line-soft)}
.chip .site .pin{flex:none;width:8px;height:11px;margin-top:1.5px;fill:var(--faint)}
.chip .ad{flex:1;min-width:0;font-size:9px;letter-spacing:.03em;color:var(--muted);
  line-height:1.4;white-space:normal;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  /* the row keeps both lines whether the address needs them or not, so a column
     of cards is a column of the same card and not a ragged edge */
  min-height:2.8em}
/* on the left-hand column the whole card reads towards the globe, so the pin
   changes sides with the text rather than being left stranded out in front */
.chip.l .site{flex-direction:row-reverse;text-align:right}
/* HOW MANY are open. Colour already said something is wrong at Mendoza; it
   cannot say whether that is one alarm or nine, and the difference decides
   which site gets opened first. A site with nothing open carries no pip at all
   - a badge reading 0 is a mark you have to read to learn it says nothing. */
.chip .alm{display:none;align-items:center;justify-content:center;flex:none;
  min-width:18px;height:18px;padding:0 5px;margin:0 9px;border-radius:9px;
  font-size:10.5px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb, var(--amber) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--amber) 60%, transparent);color:var(--amber)}
.chip .alm.on{display:inline-flex}
.chip .alm.crit{background:color-mix(in srgb, var(--red) 16%, transparent);
  border-color:color-mix(in srgb, var(--red) 60%, transparent);color:var(--red)}

/* ---- state, on the spine and on the reading ---- */
.chip.warn .spine{background:var(--amber)}
.chip.crit .spine{background:var(--red)}
.chip.off  .spine{background:var(--dim)}
.chip.warn .val{color:var(--amber)}
.chip.crit .val{color:var(--red)}
.chip.warn .tr i{background:var(--amber)}
.chip.crit .tr i{background:var(--red)}
.chip.off  .val{color:var(--faint);font-size:14px;letter-spacing:.16em}
.chip.crit .name,.chip.crit .det{border-color:color-mix(in srgb, var(--red) 45%, transparent)}
/* over the horizon: the plates KEEP their place and their numbers - the site
   has not stopped existing, it has merely gone round the back - and only the
   tie to the picture is dropped, because there is nothing left to tie it to */
.chip.far{opacity:.5}
.chip:hover,.chip:focus-visible{outline:none}
.chip:hover .det,.chip:hover .name{
  box-shadow:0 16px 40px rgba(0,0,0,.64),0 0 0 1px rgba(var(--green-rgb),.55)}
/* the focus ring lands on the NAMEPLATE, because that is what is focused and a
   ring drawn round a table nobody can tab to would be pointing at the wrong
   thing. The readout still lifts with it - the card is one object - but only
   the plate that takes the key carries the heavier ring. */
.chip .name:focus-visible{outline:none;
  box-shadow:0 16px 40px rgba(0,0,0,.64),0 0 0 2px rgba(var(--green-rgb),.9)}
.chip:has(.name:focus-visible) .det{
  box-shadow:0 16px 40px rgba(0,0,0,.64),0 0 0 1px rgba(var(--green-rgb),.55)}
/* everything else recedes while one is under the pointer - the map is a
   comparison, and a comparison needs one thing at a time to be the subject */
.theatre.hot .chip:not(.on){opacity:.42}

/* ---------- when there are more sites than screen ----------
   The readout sheds its least load-bearing rows before the column is ever
   allowed to overflow: first the bottom half of the grid, then the grid and the
   bar entirely. Every step keeps the NAME and the reading, which is the pair
   the picker actually needs. Nothing is measured here - layout() asks the real
   plate how tall it came out - so these can be tuned without a constant
   somewhere else quietly disagreeing. */
.theatre.mid .chip{width:226px;padding-bottom:60px}
.theatre.mid .chip .det{gap:6px;padding:9px 11px 10px}
.theatre.mid .chip .val{font-size:18px}
/* the bottom row goes first: alarms are already on the pip, and whether the sun
   is up is already drawn across the planet */
/* THE CAPACITY ROW GOES FIRST, not the bottom one. It used to be the last row
   that was dropped, which was right when the last row was alarms and daylight;
   it is wrong now, because the two figures the card can most afford to lose are
   the ones already printed on the reading at the top ("0% of 2.5 MW") - and
   devices and alarms are the two it cannot. So the middle row is the one that
   leaves, and the grid closes up to the four that are still news. */
.theatre.mid .chip .gr .c:nth-child(3),
.theatre.mid .chip .gr .c:nth-child(4){display:none}
.theatre.mid .chip .gr .c:nth-child(n+5){border-bottom:none}
.theatre.mid .chip .name{min-height:40px}
.theatre.mid .chip .elb{bottom:20px;height:38px}
/* one row of the grid, and the bar goes: at this size the share of nameplate
   printed beside the reading says what the bar was saying in pictures */
.theatre.slim .chip{width:216px;padding-bottom:56px}
.theatre.slim .chip .det{gap:6px;padding:8px 11px 9px}
.theatre.slim .chip .val{font-size:17px}
.theatre.slim .chip .tr{display:none}
.theatre.slim .chip .gr .c:nth-child(n+3){display:none}
.theatre.slim .chip .gr .c{border-bottom:none}
.theatre.slim .chip .gr .c:nth-child(2){border-right:none}
.theatre.slim .chip .name{min-height:38px}
.theatre.slim .chip .site{padding-top:7px}
.theatre.slim .chip .ad{font-size:8.5px;-webkit-line-clamp:1;min-height:1.4em}
.theatre.slim .chip .elb{bottom:19px;height:36px}
.theatre.dense .chip{width:204px;padding-bottom:40px}
.theatre.dense .chip .det{gap:5px;padding:7px 10px 8px}
.theatre.dense .chip .val{font-size:15px}
.theatre.dense .chip .tr,.theatre.dense .chip .gr,
.theatre.dense .chip .pcc,.theatre.dense .chip .site{display:none}
.theatre.dense .chip .nm{font-size:11px;letter-spacing:.12em}
.theatre.dense .chip .nlab{padding:4px 9px}
.theatre.dense .chip .name{min-height:28px}
.theatre.dense .chip .elb{bottom:14px;height:26px}

/* THE HOVER PANEL IS GONE, and so is the pin that propped it up.
   It was a readout for one site at a time, held open only while the pointer
   stayed still, and a double click existed purely so it could be kept. Every
   card now carries the same rows permanently, which is strictly more
   information with strictly fewer gestures - so the panel, the pin, the
   dismiss, the Escape key and the click-to-open delay that guarded the double
   click all went with it. A single click opens a site again, immediately. */

/* ---------- the list, for when the map will not do ----------
   Under 720px the map stops being readable — the nodes crowd and the chips
   overlap — so the same sites become a plain list. Same data, same click, no
   picture: the picture was never the point, choosing was. */
.fallback{display:none}
@media (max-width:720px){
  .theatre{display:none}
  .fallback{display:block;position:fixed;inset:0;z-index:7;overflow-y:auto;
    padding:96px 18px 150px}
  .flist{display:flex;flex-direction:column;gap:9px;max-width:420px;margin:0 auto}
  .frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:color-mix(in srgb, var(--panel) 92%, transparent);
    border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    font-family:var(--mono)}
  .frow:hover{border-color:var(--green)}
  .frow .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .frow .nm{font-size:12.5px;letter-spacing:.1em;color:var(--text)}
  .frow .ac{font-size:9.5px;color:var(--faint);margin-top:2px}
  .frow .kw{margin-left:auto;font-size:11.5px;color:var(--green-deep);text-align:right}
}

/* ---------- the portfolio strip ----------
   THE SUM IS BACK, and at the foot rather than the head. It was removed on the
   argument that a total over a portfolio you have not chosen yet answers a
   question nobody asked - which was wrong twice over. It is the answer to "is
   the fleet alright", which is the first question anybody opening a monitoring
   portal has; and this is the only screen in the app that can ask it, because
   it is the only one that is about all the sites at once.

   At the foot because the picture is the subject: identity across the top, the
   sum along the bottom, and the fleet in between - the strip reads as the total
   of what is above it, which is what it is. */
.sum{position:fixed;left:0;right:0;bottom:0;height:74px;z-index:6;
  display:flex;align-items:center;padding:0 20px;
  background:color-mix(in srgb, var(--panel) 93%, transparent);
  box-shadow:0 -10px 34px rgba(0,0,0,.42);
  border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.sum .s{display:flex;flex-direction:column;justify-content:center;gap:7px;flex:none;
  height:100%;padding:0 22px;border-left:1px solid var(--line)}
.sum .s:first-child{border-left:none;padding-left:0}
.sum .k{font-size:9px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;
  white-space:nowrap}
.sum .v{font-size:15px;letter-spacing:.03em;color:var(--text);line-height:1;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .v small{font-size:.62em;color:var(--faint);letter-spacing:.12em;margin-left:7px}
.sum .v .u{font-size:.62em;color:var(--faint);letter-spacing:.16em;margin-left:4px}
/* the live figure is the loudest one on the strip, and it carries its own
   track: a portfolio reading 4.2 MW says nothing until you know whether that is
   a quiet noon or a hard one */
.sum .big{min-width:212px}
.sum .big .v{font-size:20px;color:var(--green-deep)}
.sum .big .tr{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.sum .big .tr i{display:block;height:100%;width:0;border-radius:2px;background:var(--green);
  transition:width .8s ease-out}
.sum .right .live{width:6px;height:6px;border-radius:50%;flex:none;background:var(--green);
  box-shadow:0 0 8px rgba(var(--green-rgb),.75);animation:lv 2.4s ease-in-out infinite}
.sum .right{margin-left:auto;display:flex;align-items:center;gap:10px;padding-left:22px;
  font-size:9px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;
  white-space:nowrap}
/* Measured against the widest each cell actually gets. Each fold buys back
   about its own cell, and they fold in reverse order of how much somebody
   standing in front of this screen needs them. */
@media (max-width:1560px){ .sum .right{display:none} }
@media (max-width:1430px){ .sum .s.c1{display:none} }
@media (max-width:1240px){ .sum .s.c2{display:none} }
@media (max-width:1080px){ .sum .s.c3{display:none} }
@media (max-width:940px) { .sum .s.c4{display:none} }
/* On a phone the strip STAYS - the sum of the fleet is the one thing on this
   screen that is as useful on a phone as it is on a wall - but it folds to two
   rows rather than running off the side of a narrow one. These rules have to
   sit here, after the strip's own sheet: the fallback's media block is earlier
   in the file and would lose every tie to the rules it means to override. */
@media (max-width:720px){
  .sum{height:auto;flex-wrap:wrap;align-items:stretch;padding:8px 16px 12px}
  .sum .s{width:50%;height:auto;padding:8px 0;border-left:none;gap:6px}
  .sum .big{min-width:0}
  .sum .big .v{font-size:17px}
}


</style>
</head>
<body>

<!-- Under everything: the corona from wherever the sun currently is. Pointer
     transparent, at z-index 0, so the picture and every control on it stand on
     top of it. The stars and the gravity grid are on the canvas. -->
<div class="rays"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="corner tl"></div>
<div class="corner br"></div>

<!-- THE STATISTICS STRIP IS GONE. The bar used to carry generation, peak,
     capacity, revenue and device count across the top of the picture. Every one
     of those is a PLANT number, and this screen is the one place in the portal
     that is not about a plant - it is about which plant. Numbers summed over a
     portfolio you have not chosen yet answer a question nobody has asked, and
     they were the brightest thing on a screen whose whole job is the globe.
     What is left is identity and session: who you are, what time it is, and the
     way out. -->
<header class="hud">
  <div class="mark">
    <img src="logo/logo-mark.png" alt="EnerOps Data Systems Pvt Ltd">
    <span>
      <span class="word">ENEROPS OS</span>
      <span class="sub">Site Control</span>
    </span>
  </div>
  <div class="right">
    <div class="cell"><span class="k">Operator</span><span class="v" id="who">—</span></div>
    <div class="cell lc"><span class="k">Local</span><span class="v" id="clk">—</span></div>
    <button class="out" type="button" onclick="location.href='login.html'">Exit</button>
  </div>
</header>

<section class="theatre" id="theatre" aria-label="Portfolio globe. Sites are shown at their real locations on a satellite image of the Earth.">
  <!-- Two layers, and they are two layers for a reason. The EARTH is a textured
       sphere and belongs on the GPU: sampling a photograph across a rotating
       ball is a per-pixel job, and asking canvas 2D to do it would mean writing
       a quarter of a million pixels by hand every frame. The INSTRUMENT - the
       site markers, their leaders, the reference lines - belongs in canvas 2D,
       where a line is a line and text is text. Neither layer is good at the
       other's job, and both share one projection so they can never disagree
       about where a place is. -->
  <canvas id="earth" aria-hidden="true"></canvas>
  <canvas id="atlas"></canvas>

</section>

<!-- WHAT THE FLEET ADDS UP TO. Summed from the same site figures the cards
     above are drawn from, so the strip and the picture can never disagree - and
     computed here rather than carried as its own number, which is how a total
     stops being a thing somebody has to remember to update. -->
<footer class="sum">
  <div class="s c1"><span class="k">Portfolio</span>
    <span class="v"><b id="s-n">0</b><span class="u">sites</span></span></div>
  <div class="s big"><span class="k">Output now</span>
    <span class="v" id="s-kw">—</span>
    <span class="tr"><i id="s-fl"></i></span></div>
  <div class="s c2"><span class="k">Capacity</span><span class="v" id="s-ac">—</span></div>
  <div class="s c3"><span class="k">Peak today</span><span class="v" id="s-peak">—</span></div>
  <div class="s"><span class="k">Energy today</span><span class="v" id="s-e">—</span></div>
  <div class="s"><span class="k">Revenue today</span><span class="v" id="s-rev">—</span></div>
  <div class="s c4"><span class="k">Devices online</span><span class="v" id="s-dev">—</span></div>
  <!-- NO ALARM COUNT HERE. Every card above wears its own pip, in the severity
       colour, beside the name of the site it belongs to - which is the form of
       that number anybody can act on. A fleet total repeats it in the one form
       nobody can: three could be three warnings or three sites on fire, and
       either way it does not say WHERE. -->
  <div class="right"><span class="live" aria-hidden="true"></span>Live</div>
</footer>

<!-- the same sites, without the picture, for narrow screens -->
<div class="fallback">
  <div class="flist" id="flist"></div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= THE PORTFOLIO =================
   The same three sites the rest of the portal carries, with the same addresses
   and the same capacities, so the picker here reads as the picker there. A
   mockup may simulate; it may not disagree with itself. */
/* `sky` is the site's own weather, held apart from `perf`, which is the plant's
   own quality. Keeping them separate is the whole point: a site can be having a
   bad DAY without being a bad PLANT, and a screen that folds the two together
   sends somebody to a substation to look for a cloud. */
/* `lat`/`lng` are the site's real position, and they are the reason this screen
   is a map. They are read to the town the address names — Sangaria in
   Hanumangarh, Bikaner, Jaisalmer — which is the honest precision for a
   picker: close enough to put the site in the right part of the state, and not
   pretending to know which corner of which plot the inverter yard is on. The
   real backend sends surveyed coordinates and this projection will take them
   unchanged. */
const PLANTS=[
  {id:'Sangria', addr:'2 DLP, Kikarwali Road Nathwana Sangria',
   lat:29.80, lng:74.47,
   ac:2500, dc:2500, perf:1.00, sky:1.00, dev:9, down:5, warn:1, crit:0},
  {id:'Rioja',   addr:'Plot 14, Bikaner Road, Bikaner',
   lat:28.02, lng:73.31,
   ac:1800, dc:1885, perf:0.93, sky:0.96, dev:8, down:0, warn:0, crit:0},
  {id:'Mendoza', addr:'NH-52, Pokhran Road, Jaisalmer',
   lat:26.91, lng:70.92,
   ac:3200, dc:3360, perf:1.05, sky:1.03, dev:11, down:1, warn:1, crit:1}
];

/* ?plants=N grows the portfolio, so the map can be reviewed with more than
   three on it — the same switch home.html carries for its picker */
(function(){
  const N=parseInt(new URLSearchParams(location.search).get('plants')||'0',10);
  /* the towns now carry their coordinates, because a generated site still has
     to land somewhere real — a demo that scatters sites at random would be
     testing the map with a lie */
  const TOWN=[['Bikaner',28.02,73.31],['Jaisalmer',26.91,70.92],['Jodhpur',26.24,73.02],
              ['Barmer',25.75,71.39],['Pokhran',26.92,71.92],['Nagaur',27.20,73.73],
              ['Churu',28.30,74.97],['Sikar',27.61,75.14],['Alwar',27.55,76.63],
              ['Kota',25.18,75.83]];
  /* Past ten sites the demo reuses towns, and two sites on the same coordinate
     would stack into one unclickable node. So each repeat is walked a little
     way round its town on a fixed spiral — deterministic, so the picture does
     not reshuffle on reload, and small enough to stay inside the district. It
     is the one place on this screen where a position is not a fact, and it
     exists only because the DEMO duplicates towns; real sites never share a
     coordinate. */
  const used={};
  for(let k=4;k<=N;k++){
    const t=TOWN[k%TOWN.length], key=t[0];
    const dup=(used[key]=(used[key]||0)+1)-1;
    const a=dup*2.399963, rad=dup?0.10+0.055*Math.sqrt(dup):0;
    PLANTS.push({id:'Site '+String(k).padStart(2,'0'),
      addr:'NH-'+(10+k%80)+', '+t[0],
      lat:t[1]+Math.sin(a)*rad, lng:t[2]+Math.cos(a)*rad/0.89,
      ac:1500+((k*370)%2200), dc:Math.round((1500+((k*370)%2200))*1.05),
      perf:0.88+((k*7)%22)/100, sky:0.92+((k*13)%16)/100,
      dev:6+(k%8), down:(k%4===0)?2:0, warn:(k%3===0)?1:0, crit:(k%7===0)?1:0});
  }
})();

try{ $('who').textContent = (localStorage.getItem('enerops-operator')||'vikram.sethi@enerops.example').split('@')[0]; }
catch(e){ $('who').textContent='operator'; }

/* ================= SIMULATED OUTPUT =================
   A day curve, so the map looks like a fleet rather than a diagram: sites are
   bright at noon and dark at night, which is the one thing about solar that a
   picture should get right. Anchored to the viewer's own clock — nothing here
   is a reading, and the caption never claims it is. */
/* The curve is now asked about ARBITRARY hours, not just this one, because the
   energy figure integrates it from dawn to now. Same shape, one argument. */
function curve(h){
  if(h<5.5||h>18.5) return 0;
  const x=(h-5.5)/13;                       /* 0 at dawn, 1 at dusk */
  return Math.pow(Math.sin(Math.PI*x),1.35);
}
function dayFactor(){
  const d=new Date();
  return curve(d.getHours()+d.getMinutes()/60);
}
function outputOf(p){
  if(p.down>=p.dev) return 0;               /* every device down is zero, not dim */
  const live=(p.dev-p.down)/p.dev;
  return p.ac*p.perf*p.sky*dayFactor()*live;
}
function stateOf(p){
  if(p.crit>0) return 'crit';
  if(p.down>=p.dev) return 'off';
  if(p.warn>0||p.down>0) return 'warn';
  return 'ok';
}
/* The canvas cannot read a CSS variable, so it asks the document for one and
   keeps the answer. Asked ONCE, because this screen carries no theme control of
   its own — exactly like the sign-in. Both wear whatever the portal was last
   set to, applied by the script in the head before the first paint, and neither
   can change under its own feet while it is up.

  /* The globe is painted out of the portal's own tokens and nothing else. An
     earth rendered in photographic blue-greens would be a picture that had
     wandered in from another product; this one is the portal's navy, the
     portal's blue and the portal's gold, so it belongs to the same screen as
     the panel beside it. */

  SEA   =t('--blue')+'2e';   /* open ocean                      */
  SEA_LO=t('--blue')+'14';   /* the far edge, rolling away      */

  TERMC ='#ffffff';          /* the day/night line              */

   coming: this is a monitoring screen, and a number it has not measured yet is
   a forecast wearing a reading's clothes. The day has exactly one maximum, at

   and the curve at NOW before it. No search, and no pretending. */

  const h=nowH();

   number that disagreed with the picture beside it would be worse than no
   number at all. Trapezoid at five-minute steps, which at this scale is exact
   enough that a finer step moves nothing on screen. */
function energyToday(p){
  if(p.down>=p.dev) return 0;
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  const live=(p.dev-p.down)/p.dev, step=5/60;
  let e=0;
  for(let t=5.5;t<Math.min(h,18.5);t+=step) e+=curve(t)*step;
  return p.ac*p.perf*p.sky*live*e;
}

   the fleet in the world, it had no room to grow past Rajasthan, and it had
   nothing to say about the one variable a solar operator actually lives by.

   governs every number on every other screen is which of these sites the sun is
   currently on. A globe is the only projection where that fact draws itself:
   the terminator below is computed from the real position of the sun right now,

const D2R=Math.PI/180;

/* ---- where the camera is ----
   HOME is the fleet's own centroid, so the portal opens looking straight at the
   sites rather than at a globe you then have to hunt across. LAM/PHI are where
   the camera IS, tLAM/tPHI where it is going; every movement on this screen is
   an ease between the two, which is what stops a drag or a keyboard jump from
   teleporting. */
let LAM=0, PHI=0, tLAM=0, tPHI=0, sinP=0, cosP=1;
const HOME={lam:0,phi:0};
(function(){
  let a=0,b=0;
  PLANTS.forEach(function(p){ a+=p.lng; b+=p.lat; });
  HOME.lam=a/PLANTS.length; HOME.phi=b/PLANTS.length;
  LAM=tLAM=HOME.lam; PHI=tPHI=HOME.phi;
})();
function setPhi(v){ PHI=Math.max(-78,Math.min(78,v)); sinP=Math.sin(PHI*D2R); cosP=Math.cos(PHI*D2R); }
setPhi(PHI);

/* The bar and the strip float ON the field rather than cropping it, so the
   canvas is the whole window and these two numbers are the only place that
   knows where the FREE part of it starts and ends. Everything that has to stay
   clear of them - the globe's centre, its radius, the card columns - is derived
   from these and from nothing else. */
const HUD_H=62, SUM_H=74;

function size(){
  const r=oc.parentElement.getBoundingClientRect();
  W=r.width; H=r.height;
  const dpr=window.devicePixelRatio||1;
  oc.width=W*dpr; oc.height=H*dpr;
  oc.style.width=W+'px'; oc.style.height=H+'px';
  ox.setTransform(dpr,0,0,dpr,0,0);
  /* the photograph layer is sized in the same breath as the instrument layer,
     because two canvases that disagree about their pixel ratio disagree about
     where the equator is */
  if(typeof ec!=='undefined'&&ec){ ec.width=W*dpr; ec.height=H*dpr;
    ec.style.width=W+'px'; ec.style.height=H+'px'; }
  CX=W/2;
  /* centred on what is LEFT, not on the window: a globe centred on the window
     sits low, because the strip at the foot is taller than the bar at the head */
  CY=(HUD_H + (H-SUM_H))/2;
  /* The globe is NOT sized to fill the box. The readouts stand outside it in
     two fixed columns and need a clear channel to stand in: a card, its margin
     and enough leader to read as a leader is about 300px a side. Sizing the
     sphere to the box and letting the cards fall where they may is how you get
     a picker with its own numbers lying across the world. */
  R0=Math.max(120, Math.min((W-600)/2, (H-HUD_H-SUM_H-120)/2));
  R=R0*ZOOM;
}

/* ---- the projection ----
   Orthographic: the view from far enough away that the sphere reads as a
   sphere. cosc is the cosine of the angular distance from the centre of the
   view, so it is positive exactly when a point is on the side of the world
   facing us - one number that both projects a point and answers "can this be
   seen from here". */
function proj(lng,lat){
  const dl=(lng-LAM)*D2R, la=lat*D2R;
  const cl=Math.cos(la), sl=Math.sin(la), cd=Math.cos(dl);
  return { x: CX + R*cl*Math.sin(dl),
           y: CY - R*(cosP*sl - sinP*cl*cd),
           c: sinP*sl + cosP*cl*cd };

/* ---- where the sun is, actually ----

   Standard low-precision solar position - good to a fraction of a degree, which
   at this scale is a fraction of a pixel, and far better than the hour the
   terminator would have to be wrong by before anyone could notice.

const SUNSHIFT=(function(){
  const v=parseFloat(new URLSearchParams(location.search).get('sun')||'0');
  return isFinite(v)?v*3600000:0;
})();
/* ================= IS IT DAY AT THIS SITE? =================
   The terminator draws the line; this answers the question the line raises,
   which is the one an operator actually has: is the sun up AT SANGRIA, right
   now. cosz is the cosine of the solar zenith angle - the angular distance from
   the subsolar point - so it is positive exactly while the sun is above that
   site's horizon and it crosses zero at sunrise and sunset.

   This is why a fleet reading 0 kW at 03:00 is not a fault, and it is the
   difference between a picker and a picture. */
/* The cosine of the solar zenith angle: 1 with the sun straight overhead, 0 on
   the horizon, negative once it has set. The site markers want the sign of it -
   is the sun up at Sangria, yes or no - and the city lights want the VALUE,
   because a city does not switch on at the terminator, it comes up through
   dusk. One formula, two readers, so a dot and a light can never disagree about
   what time it is where they are standing. */
function sunCos(lat,lng,sub){
  const la=lat*D2R, lo=lng*D2R, sa=sub.lat*D2R, so=sub.lng*D2R;
  return Math.sin(la)*Math.sin(sa)+Math.cos(la)*Math.cos(sa)*Math.cos(lo-so);
}
function sunUpAt(p,sub){ return sunCos(p.lat,p.lng,sub) > 0; }

function sunView(){
  const s=subsolar(Date.now()+SUNSHIFT);
  const la=s.lat*D2R, dl=(s.lng-LAM)*D2R;
  const cl=Math.cos(la), sl=Math.sin(la), cd=Math.cos(dl);
  return { x: cl*Math.sin(dl),
           y: cosP*sl - sinP*cl*cd,
           z: sinP*sl + cosP*cl*cd, at:s };
}

/* ================= WHERE A STAR IS, ON THIS SCREEN =================
   The sky was wallpaper. Every star was stored as a fraction of the WINDOW, so
   turning the world spun the planet under a field that never moved - which is
   the background disagreeing with the subject, the one thing this screen may
   not do. Dragging orbits the camera around a fixed Earth; from an orbit, the
   sky sweeps.

   So the deep field gets the treatment the sun already had: a real place on a
   real sphere, projected through the same camera as the globe. The centre of
   the screen is the ANTI-CAMERA direction - straight through the middle of the
   planet and out the far side - and a star's angular distance from that point
   is its distance from the centre in pixels. That is the sun's own projection
   with a different constant, which is exactly the point: the sun and the stars
   sit on the same sphere, so they have to travel at the same rate. If they did
   not, one of them would be lying.

   SKYK is set so that ninety degrees off the anti-camera axis lands at the
   corner of the frame. Anything past that is round behind the reader, and is
   dropped rather than folded back into the picture.

   The result is returned UNLENSED. drawSpace bends it afterwards with warp(),
   the same gravity the grid is bent by, because a star near the limb is being
   seen past a planet and this file already knows what that looks like. */
let SKYK=540;
function skyXY(lng,lat){
  const la=lat*D2R, dl=(lng-LAM)*D2R;
  const cl=Math.cos(la), sl=Math.sin(la), cd=Math.cos(dl);
  const x=cl*Math.sin(dl),
        y=cosP*sl - sinP*cl*cd,
        z=sinP*sl + cosP*cl*cd;
  /* beta from the point directly behind the planet, which is where -z points */
  const b=Math.acos(Math.max(-1,Math.min(1,-z)));
  if(b>1.75) return null;
  const t=Math.hypot(x,y);
  if(t<1e-6) return [CX,CY];
  const r=SKYK*b;
  return [CX + (x/t)*r, CY - (y/t)*r];
}

/* ---- the two nebulae, which are deep sky as well ----
   They were painted at 16%/86% and 86%/20% of the viewport. Those two corners
   were a good composition and there is no reason to lose them, so rather than
   invent new coordinates this solves the OLD ones backwards - screen point to
   direction to (lng,lat) - once, at the camera the page opens on. The field
   opens looking exactly as it always did, and then it moves.

   inv() is skyXY run in reverse. The only fiddly step is the last one: y and z
   are the world's sin(lat) and cos(lat)cos(dl) turned by the camera tilt, so
   untilting them by the same angle hands both back. */
let NEB=null;
function nebInit(){
  const inv=function(fx,fy){
    const dx=fx*W-CX, dy=fy*H-CY, r=Math.hypot(dx,dy);
    const b=Math.min(Math.PI*0.92, r/SKYK), sb=Math.sin(b);
    const ux=r<1e-6?0:dx/r, uy=r<1e-6?0:-dy/r;
    const x=ux*sb, y=uy*sb, z=-Math.cos(b);
    const sl=cosP*y + sinP*z, u=-sinP*y + cosP*z;   /* u is cos(lat)cos(dl) */
    const lat=Math.asin(Math.max(-1,Math.min(1,sl))), cl=Math.cos(lat);
    const dl=cl<1e-6 ? 0 : Math.atan2(x/cl, u/cl);
    return { lng: LAM + dl/D2R, lat: lat/D2R };
  };
  NEB=[inv(0.16,0.86), inv(0.86,0.20)];
}
/* Written only when the rounded pixel actually moves, for the same reason
   sunCss is: setting a custom property to the value it already holds still
   costs a style recalculation of the whole document, and this runs sixty times
   a second. */
const nebPX=[-1e9,-1e9], nebPY=[-1e9,-1e9];
const nebO=[-1,-1], nebDir=[[1,0],[1,0]];
function skyCss(){
  if(!NEB) nebInit();
  const st=document.documentElement.style;
  for(let i=0;i<2;i++){
    const n=NEB[i];
    const la=n.lat*D2R, dl=(n.lng-LAM)*D2R;
    const cl=Math.cos(la), sl=Math.sin(la), cd=Math.cos(dl);
    const vx=cl*Math.sin(dl),
          vy=cosP*sl - sinP*cl*cd,
          vz=sinP*sl + cosP*cl*cd;
    const b=Math.acos(Math.max(-1,Math.min(1,-vz)));
    /* THESE DO NOT GET skyXY's CULL, and the reason is the size of them. A star
       is a dot: the frame edge takes it away cleanly. A nebula is a gradient
       more than a thousand pixels across, so an anchor that has left the frame
       is still painting inside it, and dropping the anchor the instant it goes
       out of bounds pops a wash off the screen. It slides AND fades instead:
       the position keeps growing, and the opacity goes out over the back
       hemisphere, which is what a thing passing behind the reader does. */
    const t=Math.hypot(vx,vy);
    if(t>1e-6){ nebDir[i][0]=vx/t; nebDir[i][1]=-vy/t; }
    const r=Math.min(SKYK*b, 2.0*Math.hypot(W/2,H/2));
    const x=Math.round(CX + nebDir[i][0]*r), y=Math.round(CY + nebDir[i][1]*r);
    const o=Math.max(0,Math.min(1,(2.8-b)/0.9));
    if(x!==nebPX[i]||y!==nebPY[i]){
      nebPX[i]=x; nebPY[i]=y;
      st.setProperty('--neb'+(i+1)+'-x', x+'px');
      st.setProperty('--neb'+(i+1)+'-y', y+'px');
    }
    if(Math.abs(o-nebO[i])>0.01){
      nebO[i]=o;
      st.setProperty('--neb'+(i+1)+'-o', o.toFixed(2));
    }
  }
}

/* ================= THE EARTH, PHOTOGRAPHED =================
   The globe was drawn from vectors: a blue disc, coastlines, a graticule. It was
   honest and it was clearly a diagram. What was asked for instead was the thing
   an iPhone puts on its lock screen - a real planet - and there is no API for
   that; Apple's is a private asset. What there IS, and what this uses, is the
   imagery that sort of picture is made from in the first place: NASA's Blue
   Marble, which is public domain.

   ONE TEXTURE, BUILT ONCE. Two NASA plates - land/topography and a cloud layer -
   composited into a single equirectangular image, 1024x512, embedded as a data
   URI so this file still opens with no server and no network. 1024x512 because
   WebGL 1 will only REPEAT a power-of-two texture, and this one has to repeat:
   longitude wraps at the antimeridian, and a clamped texture puts a seam down
   the Pacific.

   WHY THE GPU. Painting a sphere from an equirectangular map is a per-pixel
   inverse projection - for every pixel, work out which point on the ball it is
   and which pixel of the photograph that is. At this size that is roughly a
   quarter of a million lookups a frame, which is nothing for a fragment shader
   and hopeless in JavaScript. The whole sphere is one triangle and one shader;
   there is no mesh, because a sphere seen orthographically is just a circle with
   z = sqrt(1 - x^2 - y^2), and that is cheaper to solve than to tessellate.

   THE PROJECTION IS SHARED. The shader is handed the same camera basis the 2D
   layer projects with, so a marker drawn by canvas and the coastline drawn by
   the GPU land on the same pixel. If these ever drift apart the site markers
   float off their countries, which is why the basis is computed once, here, and
   passed to both rather than derived twice. */
