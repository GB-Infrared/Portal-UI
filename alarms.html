<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS · Alarms</title>
<link rel="icon" href="logo/favicon.png">
<style>

:root{
  /* ---- LIGHT · UTILITY BLUE (default) · enterprise solar-portal palette ---- */
  --bg:#f1f4f8;            /* page background            */
  --panel:#ffffff;         /* card surface               */
  --panel-2:#f5f8fb;       /* nested surface / inputs    */
  --line:#dde4ec;          /* card borders               */
  --line-soft:#e9eef4;     /* gridlines, dividers        */
  --line-hi:#b5c2d1;       /* hover / active borders     */
  --text:#152234;          /* primary text               */
  --muted:#5a6b7f;         /* secondary text             */
  --faint:#8494a6;         /* tertiary text              */
  --dim:#aab6c4;           /* dead readouts (offline)    */
  --elev:#ffffff;          /* tooltips, toasts           */
  --sel:#e8f0fb;           /* selected card surface      */
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);
  /* the row under the pointer, and only that row */
  --row-hover:rgba(11,99,206,.10);
  --shadow:rgba(19,38,63,.16);
  --on-accent:#ffffff;     /* text on a filled accent    */
  /* header bar — same surface family as the cards */
  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;         /* producing / healthy        */
  --green-rgb:18,161,80;   /* same green, for rgba() glows */
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;           /* offline / alarms           */
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;         /* yield / deviations         */
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;         /* wordmark · gold            */
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}
/* ---- DARK · same hues on navy. Only the base tokens are redefined; the
   header/brand tokens above reference them, so they follow automatically. ---- */
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  height:58px;padding:0 22px;border-bottom:1px solid var(--line);
  background:var(--topbar);color:var(--topbar-fg)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .btext{display:flex;flex-direction:column;justify-content:center;gap:1px}
.brand .word{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand);
  letter-spacing:.2px;line-height:1.05}
.brand .sub{font-size:9px;letter-spacing:.16em;color:var(--topbar-fg-2);text-transform:uppercase;
  font-weight:600;line-height:1}
@media (max-width:820px){ .brand .sub{display:none} }
/* ---------- which site the portal is on ----------
   A READOUT, NOT A CONTROL. Every page used to answer "which site am I looking
   at" with a picker of its own - four of them, four defaults, and nothing
   keeping them in step: you could walk from Monitoring to Alarms and be reading
   two different plants without either page saying so. The choosing moved to one
   place, the Sites tab a little to the right of this, and what is left here is
   the ANSWER - the same words, the same spot, on every page.
   A pin and a name, with no "SITE" label in front of it: the wordmark beside it
   already says SITE OVERVIEW and the tab beside that says Sites, and a third
   one would be the bar saying the word three times before saying anything. */
.sitenow{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;
  padding-left:16px;border-left:1px solid var(--line);color:var(--topbar-fg)}
.sitenow svg{color:var(--green);flex:none}
.sitenow .n{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.02em}
@media (max-width:900px){ .sitenow{padding-left:10px} .sitenow svg{display:none} }
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 13px;border-radius:9px;color:var(--topbar-tab);font-size:13.5px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--topbar-fg);background:var(--topbar-hover)}
.tab.active{color:var(--green);background:var(--topbar-active);font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--topbar-fg);letter-spacing:.02em}
.refresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--topbar-fg-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(var(--green-rgb),.55);
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),.5)}70%{box-shadow:0 0 0 8px rgba(var(--green-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0)}}
select{appearance:none;background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center;
  border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);
  padding:8px 28px 8px 11px;font-size:13px;font-family:inherit;outline:none}
/* Controls answer in NEUTRAL. Green on this portal means producing/healthy;
   a pointer resting on a dropdown is neither, and a green wash there competes
   with every reading that uses the colour to mean something. */
select:hover{border-color:var(--line-hi);background-color:var(--hover)}
select:focus{border-color:var(--line-hi);background-color:var(--hover)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--hover);border-color:var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text);
  border:1px solid var(--line)}
/* ---------- account menu ----------
   The avatar was a dead circle: it named the signed-in user and offered nothing.
   It is the only place Settings and Sign out can live without spending a tab on
   either, and every page carries the same one so the way out is never hunted for. */
.acct{position:relative;display:flex}
.avatar{padding:0}
.avatar:hover,.acct.open .avatar{border-color:var(--line-hi);background:var(--hover)}
.acctmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;width:224px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -16px var(--shadow);padding:6px;display:none}
.acct.open .acctmenu{display:block}
.acctwho{padding:9px 10px 10px}
.acctwho .nm{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.acctwho .em{font-size:11.5px;color:var(--muted);line-height:1.35;word-break:break-all}
.acctdiv{height:1px;background:var(--line-soft);margin:4px}
.acctitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--text);width:100%;
  border:none;background:transparent;text-align:left;font-family:inherit}
.acctitem:hover{background:var(--hover)}
.acctitem svg{flex:none;color:var(--faint)}
.acctitem:hover svg{color:var(--muted)}
.acctitem.out:hover{background:var(--red-soft);color:var(--red)}
.acctitem.out:hover svg{color:var(--red)}


/* ---------- page shell ----------
   One column, not two. Monitoring needs a rail because its chart is driven by a
   device you pick; an alarm list is driven by the filter bar above it, and every
   pixel a rail took would come out of the columns. */
.wrap{max-width:2400px;margin:0 auto;padding:14px clamp(14px,1.5vw,28px) 34px;
  display:flex;flex-direction:column;gap:14px}
.toprow{max-width:2400px;margin:0 auto;padding:16px clamp(14px,1.5vw,28px) 0}

/* ---------- filter bar ---------- */
/* bare toolbar — no card around the controls, keeps the page open */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;padding:0 2px 2px;min-width:0}
.field{position:relative;display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field select,.field .input,.field input{height:34px;min-width:116px}
/* height alone sets this box. The base rule's 8px vertical padding on top of it
   left a 16px content box for 13px text, which clipped descenders. */
.field select{padding-top:0;padding-bottom:0}
/* ---------- one window, two controls ----------
   A datetime-local field looks tidy until it is opened: the browser answers it
   with a calendar AND two spinner columns in a single popup, wide enough to
   land across the field beside it - which is the thing that reads as broken.
   A date input and a time input sharing one box open the two compact pickers
   this portal already uses elsewhere, and the field still says one thing. */
.dt{position:relative;display:flex;align-items:stretch;height:34px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm)}
.dt:hover{border-color:var(--line-hi)}
.dt:focus-within{border-color:var(--line-hi);background-color:var(--hover)}
.dt input{height:100%;border:none;background:transparent;color:var(--text);
  font-family:var(--mono);font-weight:600;font-size:12.5px;padding:0 9px;outline:none}
.dt input[type=date]{min-width:132px}
.dt input[type=time]{min-width:92px;border-left:1px solid var(--line)}
.field input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55}
.field input:hover::-webkit-calendar-picker-indicator{opacity:1}
/* The date half reads as a button, so it must not look like text to be dragged
   over. user-select handles a real drag-selection, but the blue block on the
   day is NOT that - it is the date input's own segment highlight, drawn inside
   the control's shadow DOM, which user-select cannot reach. Each segment has to
   be told separately not to paint it. The time half keeps its highlight: there
   you are editing a number, and you need to see which one. */
.dt input[type=date]{user-select:none;-webkit-user-select:none;cursor:pointer}
.dt input[type=date]::selection{background:transparent}
.dt input[type=date]::-webkit-datetime-edit-day-field,
.dt input[type=date]::-webkit-datetime-edit-month-field,
.dt input[type=date]::-webkit-datetime-edit-year-field{
  background:transparent;color:inherit;outline:none;padding:0}
/* :focus wins over the rule above in the UA sheet, so it is repeated for it */
.dt input[type=date]::-webkit-datetime-edit-day-field:focus,
.dt input[type=date]::-webkit-datetime-edit-month-field:focus,
.dt input[type=date]::-webkit-datetime-edit-year-field:focus{
  background:transparent;color:inherit;outline:none}

/* ---------- the time half ----------
   Hours and minutes are two separate dropdowns, not two columns of one panel.
   The browser's time popup lays its columns out independently, so they drift
   out of step as you scroll and open a ragged gap down the middle - and a
   custom panel only moves that problem indoors, since two lists side by side
   have to be kept in step by hand. Two dropdowns that are never open together
   cannot be out of step with each other: the alignment problem is removed
   rather than solved. It is also the idiom the rest of this bar already uses. */
.tpick{display:flex;align-items:center;gap:2px;padding:0 7px;border-left:1px solid var(--line)}
.tbit{position:relative;height:26px;min-width:31px;padding:0 5px;border-radius:6px;
  border:1px solid transparent;background:transparent;color:var(--text);
  font-family:var(--mono);font-size:12.5px;font-weight:600}
.tbit:hover{background:var(--hover);border-color:var(--line-hi)}
.tbit.open{background:var(--sel);border-color:var(--line-hi)}
.tsep{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--faint)}
.tlist{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:2px;width:62px;max-height:214px;
  overflow-y:auto;scrollbar-width:thin;padding:5px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -16px var(--shadow)}
.tlist[hidden]{display:none}
.tlist button{flex:none;height:26px;border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--text);
  font-family:var(--mono);font-size:12.5px;font-weight:600}
.tlist button:hover{background:var(--hover)}
.tlist button.on{background:var(--sel);border-color:var(--line-hi)}

/* ---------- plant picker ----------
   The same cards the home header opens, in a dropdown: a site is chosen on its
   state, not just on its name, so each card carries what is open on it. It is
   the panel idiom the rest of this bar already uses - the native <select> next
   to three styled dropdowns was the odd one out, and it could not have shown a
   count anyway. */
.pplant{width:212px;padding:7px;display:flex;flex-direction:column;gap:5px;
  max-height:min(60vh,320px);overflow-y:auto;scrollbar-width:thin}
.pcard{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;
  text-align:left;font-family:inherit;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 10px;color:var(--text)}
.pcard:hover{background:var(--hover);border-color:var(--line-hi)}
/* the plant already on screen is marked by surface, not by colour - a green
   "current" would read as a health light rather than as a selection */
.pcard.on{background:var(--sel);border-color:var(--line-hi)}
.pcard .top,.pcard .row{display:flex;align-items:baseline;gap:6px;min-width:0}
.pcard .nm{font-family:var(--serif);font-size:12.5px;font-weight:700;color:var(--text);
  line-height:1.15;white-space:nowrap}
/* a dot, not the word: at this size CURRENT would take a third of the line */
.pcard.on .nm::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:6px;vertical-align:middle;background:var(--line-hi)}
/* flex:1 1 0 with min-width:0 is what actually lets it ellipsis - a flex item
   will not shrink below its content width otherwise */
.pcard .ad{flex:1 1 0;min-width:0;text-align:right;font-size:9px;color:var(--faint);
  line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the open count is the other half of the decision, so it is stated on every
   card - including the ones with nothing open, which is itself the answer */
.pcard .alm{display:inline-flex;align-items:center;gap:4px;
  font-size:8.5px;font-weight:800;letter-spacing:.05em;white-space:nowrap}
.pcard .alm::before{content:"";width:5px;height:5px;border-radius:50%;flex:none}
.pcard .alm.hot{color:var(--red)}    .pcard .alm.hot::before{background:var(--red)}
.pcard .alm.cold{color:var(--faint)} .pcard .alm.cold::before{background:var(--green)}

/* ---------- multi-select filter ----------
   One alarm question is rarely one value: "INV03 and INV07", "alarms and
   warnings". A native <select multiple> answers that with a scrolling box that
   needs a modifier key to add the second value and looks different on every
   OS. This is the column picker's panel with a different list in it - one
   idiom on the page for "tick several", not two. */
.msel{position:relative;display:flex}
.mbtn{display:flex;align-items:center;width:100%;min-width:158px;height:34px;
  padding:0 28px 0 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-weight:600;text-align:left;
  background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center}
.mbtn:hover,.msel.open .mbtn{border-color:var(--line-hi);background-color:var(--hover)}
.mbtn .mlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* "nothing chosen" is a real state, not a value - it is said in the muted voice
   so a set filter is legible at a glance across the whole bar */
.mbtn .mlab.any{color:var(--muted);font-weight:600}
.mpanel{width:214px;min-width:100%}
/* The rows are <label>s and they sit inside a .field, so the filter bar's own
   label rule reached them and set the device names in tiny faint tracked-out
   caps - the voice reserved for the name ABOVE a control, printed inside it.
   Stated back explicitly; a value reads as a value. */
.mpanel .colrow{font-size:12.5px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--text)}
/* and the same rule's min-width:116px reached the tick boxes, which width:14px
   cannot undo - a min-width is not overridden by a width - so every checkbox
   was a 116px box with a 14px tick painted in it, and each device name sat a
   filter-field away from the box that selects it */
.mpanel .colrow input{min-width:0}

/* ---------- summary bar ----------
   The table answers "which alarms"; this answers "how bad, right now", which is
   the question you arrive with.

   One bar, not four cards. Four cards on a grid stretch to a quarter of the
   viewport each - a 2-digit count in a 370px box, which is the airiness the KPI
   strip was already trimmed for. Segments in a single bar size to their own text
   instead, and the bar costs 26px less height than the cards did, which a page
   that scrolls a long table can spend better elsewhere. */
.sumbar{display:flex;align-items:stretch;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:1px}
.sum{display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:9px 20px;min-width:132px}
.sum+.sum{border-left:1px solid var(--line-soft)}
.sum .k{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sum .v{font-family:var(--mono);font-weight:800;font-size:20px;letter-spacing:-.7px;line-height:1.05}
.sum.alarm .v{color:var(--red)}
.sum.warn .v{color:var(--amber)}
.sum.ok .v{color:var(--green)}

/* ---------- card + table ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.card .chead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 16px 10px}
.chead .title{font-size:14.5px;font-weight:700;white-space:nowrap;flex:none}
.chead .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.ttools{display:flex;align-items:center;gap:8px;padding:0 16px 13px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;
  letter-spacing:.04em;background:transparent;border:1px solid var(--line);color:var(--muted)}
.tbtn:hover{color:var(--text);border-color:var(--line-hi);background:var(--hover)}
.tablewrap{overflow-x:auto}
table{width:100%;min-width:820px}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:9px 14px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
/* every column sorts: an alarm table is read by "newest", "worst" or "which
   device", and which of those matters changes with the question being asked */
thead th.so{cursor:pointer;user-select:none}
thead th.so:hover{color:var(--text)}
thead th .ar{margin-left:5px;font-size:8px;color:var(--faint)}
thead th.on{color:var(--text)}
thead th.on .ar{color:var(--green)}
/* the header the table keeps before data arrives - stated, but plainly not a
   reading, so nobody mistakes the shape for content */
thead th.ph{color:var(--faint);font-weight:600}
tbody td{padding:8px 14px;font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:center;
  border-bottom:1px solid var(--line-soft);color:var(--text);white-space:nowrap}
/* the message is the one column that is prose, so it is the one that may wrap
   out of the mono grid and the one given room to be long */
tbody td.msg{font-family:var(--sans);font-weight:600;white-space:normal;min-width:210px}
tbody td.dim{color:var(--faint);font-weight:600}
/* THE ROW UNDER THE POINTER LIFTS OFF THE TABLE. A tint alone was not enough on
   a table this wide - at 4.5% it was invisible, and even raised it only shaded a
   band the eye still slips out of. So the row is picked out the way every other
   raised surface in this portal is: its own ring, and a shadow under it. It
   reads as one object rather than as a row of separate cells, which is the point
   when a value has to be carried across ten columns.

   It marks where the POINTER is, so it clears the moment the pointer leaves and
   can never be mistaken for a selection that persists. The table's borders are
   separated rather than collapsed for it: a collapsed table draws one shared
   border between two rows, and a browser will not paint a shadow on a row that
   does not own its own edges. Only bottom borders are ever set here, so nothing
   doubles up and the table looks exactly as it did. */
table{border-collapse:separate;border-spacing:0}
tbody tr{transition:background-color .12s ease,box-shadow .12s ease}
tbody tr:hover{background:var(--row-hover);position:relative;z-index:1;
  box-shadow:inset 0 0 0 1px var(--line-hi),0 10px 22px -12px var(--shadow),0 2px 6px -4px var(--shadow)}
/* the readings come up to full strength with it; a dash stays a dash, because a
   cell with nothing in it has nothing to bring forward */
tbody tr:hover td:not(.nil){color:var(--text)}
.empty-note{display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:12.5px;font-family:var(--mono)}
.empty-note.tall{min-height:190px}

/* severity and status read as state, not as text: colour carries the first
   glance and the word carries the certainty */
.sev{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;
  font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.08em}
.sev::before{content:"";width:6px;height:6px;border-radius:50%;flex:none}
.sev.alarm{color:var(--red);background:var(--red-soft)}      .sev.alarm::before{background:var(--red)}
.sev.warn{color:var(--amber);background:var(--amber-soft)}   .sev.warn::before{background:var(--amber)}
.sev.event{color:var(--muted);background:var(--panel-2)}     .sev.event::before{background:var(--faint)}
.stt{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.08em}
.stt.active{color:var(--red)}
.stt.resolved{color:var(--green)}

/* ---------- column picker ---------- */
/* The column picker is the filter: what is ticked here is what the table shows
   AND what the CSV carries. Received time is not optional - an alarm without
   when it arrived is not an alarm. */
.colpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:250px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -16px var(--shadow);padding:8px;
  max-height:min(60vh,460px);overflow-y:auto;scrollbar-width:thin}
.colpanel[hidden]{display:none}
.colhead{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:4px 8px 8px}
.colrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;cursor:pointer;width:100%;background:transparent;
  border:none;color:inherit;text-align:left}
.colrow:hover{background:var(--hover)}
.colrow input{width:14px;height:14px;accent-color:var(--green);flex:none}
/* the received-time row is stated, not offered - it cannot be switched off */
.colfoot{display:flex;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line-soft);margin-top:6px}
.colfoot button{flex:1;padding:6px 0;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:700}
.colfoot button:hover{border-color:var(--line-hi);color:var(--text);background:var(--hover)}

/* ---------- pager ---------- */
.tfoot{display:flex;align-items:center;gap:16px;padding:11px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tfoot .sp{margin-left:auto}
.pgbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pgbtn:hover:not(:disabled){color:var(--text);border-color:var(--line-hi)}
.pgbtn:disabled{opacity:.35;cursor:default}
.tfoot .range{font-family:var(--mono)}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:9px;
  padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 30px -8px var(--shadow);
  animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .topbar{gap:12px;padding:0 14px}
  .wrap{padding:12px 14px 30px}
  .toprow{padding:12px 14px 0}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- the row, spelled out in full ----------
   A table wider than the screen is read by scrolling sideways, and a row read
   sideways is a row half remembered: by the time the last column is on screen,
   the device name that started it is not. Hovering a row lifts the WHOLE of it
   out as a card - every column of that one row, label and value, in one place -
   so the reading is taken in a glance instead of in two swipes.

   It follows the pointer, it is never clickable, and it goes the moment the
   pointer leaves. It opens on every row, whether or not the table is currently
   wider than the screen - the same gesture has to give the same answer on a
   laptop as on a wall display, and a reader who learns it on one must not find
   it missing on the other. */
.rowpop{position:fixed;z-index:120;pointer-events:none;opacity:0;transition:opacity .12s ease;
  background:var(--elev);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  box-shadow:0 20px 48px -18px var(--shadow),0 3px 10px -6px var(--shadow);
  max-width:min(620px,92vw)}
.rowpop.on{opacity:1}
.rowpop .rp-h{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.05em;
  color:var(--text);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
.rowpop .rp-g{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;align-items:baseline}
.rowpop .rp-g.two{grid-template-columns:auto 1fr auto 1fr}
.rowpop .rp-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.rowpop .rp-v{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);
  text-align:right;white-space:nowrap}
/* a cell with nothing in it stays a dash, and says so quietly */
.rowpop .rp-v.nil{color:var(--faint);font-weight:600}
</style>

</script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ---------- toasts ---------- */
window.T=function(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);return false;
};

/* ---------- theme ----------
   THERE IS NO TOGGLE, AND THERE IS NO DARK.

   The portal shipped with both themes and a control in the header to swap
   between them. It is gone: the palette is final, it is the light one, and a
   switch offering a second answer to a settled question invites somebody to
   unsettle it. Every screen - including the sign-in and the site overview,
   which used to pin themselves to dark - now resolves to the one set of tokens
   on :root.

   The dark block was DELETED rather than left unreferenced. A theme still
   sitting in the stylesheet is a theme that returns the first time anyone sets
   data-theme by hand. */
/* ---------- account menu ---------- */
window.toggleAcct=function(e){
  e.stopPropagation();
  const a=$('acct'), open=a.classList.toggle('open');
  $('acctbtn').setAttribute('aria-expanded', open?'true':'false');
};
document.addEventListener('click',function(){
  const a=$('acct'); if(!a) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  const a=$('acct'); if(!a||!a.classList.contains('open')) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false'); $('acctbtn').focus();
});


/* ---------- simulated plant time (anchored for demo) ---------- */
const START_T=12+10/60+3/3600, t0=Date.now();
const nowT=()=>START_T+(Date.now()-t0)/3600000;
const pad=n=>String(n).padStart(2,'0');
function fmtT(t,withS){t=((t%24)+24)%24;let h=Math.floor(t),m=Math.floor((t-h)*60),s=Math.floor((t*3600)%60);
  const ap=h<12?'AM':'PM';let hh=h%12;if(hh===0)hh=12;
  return hh+':'+pad(m)+(withS?(':'+pad(s)):'')+' '+ap;}

/* ---------- the alarm log ----------
   Seeded, so the demo reads the same on every load and a screenshot taken today
   still matches the page tomorrow. */
let SEED=20260727;
const rnd=()=>{SEED=(SEED*1103515245+12345)&0x7fffffff;return SEED/0x7fffffff;};
const pick=a=>a[Math.floor(rnd()*a.length)];

const DEVICES=['INV01','INV02','INV03','INV04','INV05','INV06','INV07','MFM01','WMS01'];
/* the same three sites the rest of the portal carries, addresses included, so
   the picker here reads as the picker there */
const PLANTS=[
  {id:'Sangria', addr:'2 DLP, Kikarwali Road Nathwana Sangria'},
  {id:'Rioja',   addr:'Plot 14, Bikaner Road, Bikaner'},
  {id:'Mendoza', addr:'NH-52, Pokhran Road, Jaisalmer'}
];
let PSEL=[];                 /* empty = every plant, as everywhere else on this bar */
const FAULTS=[
  {t:'Communication Error',        sev:'alarm'},
  {t:'DC Insulation Fault',        sev:'alarm'},
  {t:'Grid Over Voltage',          sev:'alarm'},
  {t:'Grid Under Frequency',       sev:'alarm'},
  {t:'Earth Fault',                sev:'alarm'},
  {t:'Output Below Expected',      sev:'warn'},
  {t:'String Current Deviation',   sev:'warn'},
  {t:'Over Temperature',           sev:'warn'},
  {t:'Fan Speed Low',              sev:'warn'},
  {t:'Inverter Restarted',         sev:'event'},
  {t:'Firmware Updated',           sev:'event'},
  {t:'Grid Reconnected',           sev:'event'}
];

/* The seed carries the plant, so choosing a different site gives a different
   log rather than the same 46 rows under a new name. Nothing about the site is
   modelled - this is demo data - but a selector that visibly does nothing reads
   as a broken selector, and the point of the bar applying on change is that
   every control in it can be seen to do something. */
const seedOf=name=>String(name).split('').reduce((h,c)=>(h*31+c.charCodeAt(0))&0xffff,7);
const PIDX=id=>Math.max(0,PLANTS.map(function(p){return p.id;}).indexOf(id));
function buildLog(n,plant,from,to){
  SEED=20260727+seedOf(plant)*613;
  const span=to-from, out=[];
  for(let i=0;i<n;i++){
    const d=pick(DEVICES), f=pick(FAULTS);
    /* ids are blocked per plant: several sites can be listed together, and
       two alarms sharing an id in one table is a table you cannot cite */
    /* An alarm is a moment, not a time of day: it carries the date it arrived
       on, so a window spanning two days can be read at all. Landed inside the
       chosen window, so the two date fields describe the list rather than
       labelling it. */
    const rec=from+rnd()*span;
    const open=rnd()<(f.sev==='alarm'?.45:f.sev==='warn'?.3:.05);
    /* An alarm that had not cleared by the end of the window is still OPEN at
       the end of the window. Clamping the clear time to the window edge instead
       stacked a dozen rows on the same second - a readout that looks stuck, and
       a claim the log cannot make: nothing was observed after `to`. */
    const clr=rec+(0.2+rnd()*3.4)*3600000;
    const done=!open&&clr<=to;
    out.push({
      id:'ALM-'+(2000+PIDX(plant)*1000+i),
      recv:rec,
      res:done?clr:null,
      status:done?'resolved':'active',
      text:f.t, sev:f.sev,
      dev:d, plant:plant
    });
  }
  return out;
}
/* the two ends of the window, as epoch ms - null while they disagree */
function winRange(){
  const a=Date.parse($('f-from-d').value+'T'+($('f-from-t').value||'00:00')+':00');
  const b=Date.parse($('f-to-d').value+'T'+($('f-to-t').value||'00:00')+':00');
  return (isFinite(a)&&isFinite(b)&&b>a)?[a,b]:null;
}
/* ?empty=1 reviews the state before a backend is wired; ?rows=N sizes the log */
const Q=new URLSearchParams(location.search);
const EMPTY=Q.get('empty')==='1';
const ROWS=parseInt(Q.get('rows')||'46',10);
/* Sites do not log the same number of alarms, and the picker prints that count
   on every card - so a demo that gave all three exactly 46 put an identical
   number on three cards, which reads as a stuck readout rather than as data.
   Derived from the plant, so the card and the table cannot disagree. */
const rowsFor=id=>Math.max(6,ROWS+(seedOf(id)%19)-9);
let LOG=[];
/* one place the log comes from - a backend refetches here and nothing else
   about the page changes */
function reload(){
  if(EMPTY){ LOG=[]; return; }
  const w=winRange();
  if(!w) return;              /* an inverted window keeps the last good log */
  const ids=PSEL.length?PSEL:PLANTS.map(function(p){ return p.id; });
  LOG=[];
  ids.forEach(function(id){ LOG=LOG.concat(buildLog(rowsFor(id),id,w[0],w[1])); });
}
reload();

/* ---------- columns ----------
   Order here is the order in the table AND in the file, so moving a column is
   one edit rather than two that can drift apart. Received Time comes first
   because it is the alarm's identity in time - every other column describes the
   alarm, this one says which alarm it is. */
const COLDEF=[
  {k:'recv',   t:'Received Time'},
  {k:'res',    t:'Resolved Time'},
  {k:'status', t:'Status'},
  {k:'text',   t:'Alarms Text'},
  {k:'id',     t:'Alarm Id'},
  {k:'sev',    t:'Severity'},
  {k:'dev',    t:'Device Name'}
  /* NO PLANT COLUMN. The table is one site's log - the portal is on one site,
     and it is named in the bar at the top of every page - so a column repeating
     that name on all two hundred rows is the same word two hundred times, in
     the widest thing on the page, saying nothing that changes between rows. */
];
/* Every column, always - in the table and in the export, which is why both
   still ask this one function rather than each keeping its own list. */
const shown=()=>COLDEF.slice();

/* ---------- filter + sort + page state ---------- */
let F={dev:[],sev:[],status:[]};          /* empty list = no narrowing at all */
let SORT={k:'recv',dir:-1};                /* newest first: the default question */
let PAGE=0, PER=100;

function filtered(){
  return LOG.filter(function(a){
    if(F.dev.length&&F.dev.indexOf(a.dev)<0) return false;
    if(F.sev.length&&F.sev.indexOf(a.sev)<0) return false;
    if(F.status.length&&F.status.indexOf(a.status)<0) return false;
    return true;
  });
}
const SEVRANK={alarm:0,warn:1,event:2};
function sorted(rows){
  const k=SORT.k, d=SORT.dir;
  return rows.slice().sort(function(a,b){
    let x,y;
    if(k==='sev'){ x=SEVRANK[a.sev]; y=SEVRANK[b.sev]; }
    else if(k==='recv'){ x=a.recv; y=b.recv; }
    else if(k==='res'){ x=a.res==null?-Infinity:a.res; y=b.res==null?-Infinity:b.res; }
    else { x=String(a[k]); y=String(b[k]); }
    if(x<y) return -1*d; if(x>y) return 1*d; return 0;
  });
}

/* ---------- the table ---------- */
/* 08.08.2026 16:52:35 - the date first, and the clock in 24 hours. An alarm
   log is read by scanning down a column for the row where the day changes, and
   a 12-hour clock hides that: 12:05 AM sorts before 11:58 PM but does not look
   like it. */
function fmtDT(ms){
  const d=new Date(ms);
  return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+
         pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

const CELL={
  recv:  a=>['ts',fmtDT(a.recv)],
  res:   a=>a.res==null?['dim','—']:['ts',fmtDT(a.res)],
  status:a=>['','<span class="stt '+a.status+'">'+a.status.toUpperCase()+'</span>'],
  text:  a=>['msg',a.text],
  sev:   a=>['','<span class="sev '+a.sev+'">'+(a.sev==='warn'?'WARNING':a.sev.toUpperCase())+'</span>'],
  id:    a=>['',a.id],
  dev:   a=>['',a.dev]
};
/* the export reads plain text where the table reads markup, so a CSV cell is
   never a stray <span> */
const RAW={
  recv:  a=>fmtDT(a.recv),
  res:   a=>a.res==null?'':fmtDT(a.res),
  status:a=>a.status.toUpperCase(),
  text:  a=>a.text,
  sev:   a=>a.sev==='warn'?'WARNING':a.sev.toUpperCase(),
  id:    a=>a.id,
  dev:   a=>a.dev
};

const ARROW=d=>'<span class="ar">'+(d<0?'▼':'▲')+'</span>';

function renderTable(){
  const cols=shown();
  const rows=sorted(filtered());
  const pages=Math.max(1,Math.ceil(rows.length/PER));
  if(PAGE>=pages) PAGE=pages-1;
  const from=PAGE*PER, slice=rows.slice(from,from+PER);

  /* Before a backend is wired there is nothing to name the columns with, so the
     table keeps its shape and says so, rather than collapsing to a bare box. */
  if(!rows.length&&!LOG.length){
    $('thead').innerHTML='<tr>'+cols.map(c=>'<th class="ph">'+c.t+'</th>').join('')+'</tr>';
    $('tbody').innerHTML='<tr><td colspan="'+cols.length+'"><div class="empty-note tall">No rows</div></td></tr>';
  } else {
    $('thead').innerHTML='<tr>'+cols.map(function(c){
      const on=SORT.k===c.k;
      return '<th class="so'+(on?' on':'')+'" onclick="sortBy(\''+c.k+'\')" title="Sort by '+c.t+'">'+
             c.t+(on?ARROW(SORT.dir):'')+'</th>';
    }).join('')+'</tr>';
    $('tbody').innerHTML=slice.length
      ? slice.map(function(a){
          return '<tr>'+cols.map(function(c){
            const cell=CELL[c.k](a);
            return '<td'+(cell[0]?' class="'+cell[0]+'"':'')+'>'+cell[1]+'</td>';
          }).join('')+'</tr>';
        }).join('')
      : '<tr><td colspan="'+cols.length+'"><div class="empty-note tall">No alarms match these filters</div></td></tr>';
  }

  $('range').textContent=rows.length
    ? (from+1)+'-'+Math.min(from+PER,rows.length)+' of '+rows.length
    : '0-0 of 0';
  $('prev').disabled=PAGE<=0;
  $('next').disabled=from+PER>=rows.length;
  renderSummary(rows);
}

window.sortBy=function(k){
  if(SORT.k===k) SORT.dir=-SORT.dir; else { SORT.k=k; SORT.dir=(k==='recv'||k==='res')?-1:1; }
  PAGE=0; renderTable();
};
window.pageBy=function(d){ PAGE=Math.max(0,PAGE+d); renderTable(); };
$('per').addEventListener('change',function(){ PER=parseInt(this.value,10); PAGE=0; renderTable(); });

/* ---------- summary ----------
   Counted off the SAME filtered rows the table is showing, so the tiles and the
   list can never disagree about how many alarms there are. */
function renderSummary(rows){
  const act=rows.filter(a=>a.status==='active');
  const alarm=act.filter(a=>a.sev==='alarm').length;
  const warn=act.filter(a=>a.sev==='warn').length;
  const resolved=rows.length-act.length;
  /* A count and what it is counting, nothing else. The caption under each number
     was restating the tile's own label - "Needs action now" under Alarm, "Watch"
     under Warning - which is a line of type per tile that tells a reader nothing
     the heading did not. */
  $('sumbar').innerHTML=
    tile('Active alarms',act.length,act.length?'alarm':'ok')+
    tile('Alarm',alarm,alarm?'alarm':'ok')+
    tile('Warning',warn,warn?'warn':'ok')+
    tile('Resolved',resolved,'ok');
}
function tile(k,v,cls){
  return '<div class="sum '+cls+'"><div class="k">'+k+'</div>'+
         '<div class="v">'+v+'</div></div>';
}

/* ---------- export ----------
   Exports exactly the chosen columns, in the table's order, for every row the
   filters allow - not just the page on screen. A real file, not a toast, so the
   choice can actually be checked. */
window.exportCsv=function(){
  const cols=shown();
  const q=s=>/[",\r\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':String(s);
  const head=cols.map(c=>q(c.t)).join(',');
  const body=sorted(filtered()).map(a=>cols.map(c=>q(RAW[c.k](a))).join(','));
  const csv=[head].concat(body).join('\r\n');
  /* leading BOM: without it Excel reads the file in the system codepage and any
     non-ASCII in a device name comes out as mojibake */
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  /* the file is named for the window it covers, so two exports taken an hour
     apart do not overwrite each other in the downloads folder */
  a.href=url; a.download='Alarms_'+$('f-from-d').value+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  T('Exported '+body.length+' rows · '+cols.length+' columns');
};

/* ---------- filters ----------
   The bar applies itself: there is no confirm step, so the state the controls
   describe IS the state on screen. A backend swaps the body of applyFilters for
   a fetch; the wiring around it does not change. */
window.applyFilters=function(quiet){
  PAGE=0; renderTable();
  if(!quiet) countToast();
};

/* One line, replaced in place - not a stack. Ticking four devices is ONE
   decision, and answering it with four toasts is the page shouting over a
   table that already changed under the pointer. The wait also lets a run of
   ticks settle, so the count that finally speaks is the count on screen. */
let cToast=null, cWait=0, cGone=0;
function countToast(){
  clearTimeout(cWait);
  cWait=setTimeout(function(){
    const on=F.dev.length+F.sev.length+F.status.length;
    const msg=on?(filtered().length+' alarms match'):'Showing every alarm in the window';
    if(!cToast||!cToast.isConnected){
      cToast=document.createElement('div'); cToast.className='toast';
      $('toasts').appendChild(cToast);
    }
    cToast.textContent=msg;
    clearTimeout(cGone);
    cGone=setTimeout(function(){ if(cToast) cToast.remove(); },2600);
  },220);
}

/* one tick-several control, built three times */
const MSELS=[];
function multiSelect(o){
  const mount=$(o.mount);
  const btn=document.createElement('button');
  btn.type='button'; btn.className='mbtn'; btn.setAttribute('aria-expanded','false');
  const lab=document.createElement('span'); lab.className='mlab any';
  btn.appendChild(lab);
  const pan=document.createElement('div'); pan.className='colpanel mpanel'; pan.hidden=true;
  mount.appendChild(btn); mount.appendChild(pan);

  function label(){
    const s=F[o.key];
    lab.className='mlab'+(s.length?'':' any');
    lab.textContent = !s.length ? o.any
      : s.length===1 ? (o.options.filter(x=>x.v===s[0])[0]||{t:s[0]}).t
      : s.length+' selected';
  }
  function draw(){
    pan.innerHTML='<div class="colhead">'+o.head+'</div>'+
      o.options.map(function(x){
        const on=F[o.key].indexOf(x.v)>=0;
        return '<label class="colrow"><input type="checkbox" value="'+x.v+'"'+
               (on?' checked':'')+'>'+x.t+'</label>';
      }).join('')+
      '<div class="colfoot"><button type="button" value="all">All</button>'+
      '<button type="button" value="none">None</button></div>';
  }
  function open(on){
    if(on){ MSELS.forEach(function(m){ if(m!==api) m.close(); }); draw(); }
    pan.hidden=!on; mount.classList.toggle('open',on);
    btn.setAttribute('aria-expanded',on?'true':'false');
  }
  btn.addEventListener('click',function(e){ e.stopPropagation(); open(pan.hidden); });
  pan.addEventListener('click',function(e){
    e.stopPropagation();
    const b=e.target.closest('.colfoot button'); if(!b) return;
    F[o.key]= b.value==='all' ? o.options.map(x=>x.v) : [];
    draw(); label(); applyFilters();
  });
  pan.addEventListener('change',function(e){
    const cb=e.target; if(cb.type!=='checkbox') return;
    const s=F[o.key], i=s.indexOf(cb.value);
    if(cb.checked&&i<0) s.push(cb.value); else if(!cb.checked&&i>=0) s.splice(i,1);
    /* keep the offered order, so "2 selected" always expands the same way */
    s.sort(function(a,b){
      return o.options.findIndex(x=>x.v===a)-o.options.findIndex(x=>x.v===b);
    });
    label(); applyFilters();
  });

  const api={ close:function(){ if(!pan.hidden) open(false); } };
  MSELS.push(api); label();
}
multiSelect({mount:'m-dev',key:'dev',any:'All devices',head:'Devices',
  options:DEVICES.map(function(d){ return {v:d,t:d}; })});
multiSelect({mount:'m-sev',key:'sev',any:'Any severity',head:'Severity',
  options:[{v:'alarm',t:'Alarm'},{v:'warn',t:'Warning'},{v:'event',t:'Event'}]});
multiSelect({mount:'m-st',key:'status',any:'Any status',head:'Status',
  options:[{v:'active',t:'Active'},{v:'resolved',t:'Resolved'}]});
document.addEventListener('click',function(){ MSELS.forEach(function(m){ m.close(); }); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') MSELS.forEach(function(m){ m.close(); });
});

/* the window is part of the query too, so moving either end re-reads the log
   rather than re-rendering the same rows */
['f-from-d','f-from-t','f-to-d','f-to-t'].forEach(function(id){
  $(id).addEventListener('change',function(){ reload(); applyFilters(); });
});

/* ================= WHICH SITE THE PORTAL IS ON =================
   ONE site, chosen ONCE, on the Sites screen.

   This page used to choose its own, from a picker in the bar below, and so did
   three others. Four pickers is four answers to a question that has one, and
   nothing kept them in step - the site overview already exists to answer "which
   site", and answering it a second time is how a portal ends up disagreeing
   with itself.

   So the pickers are gone, and this is the whole of what replaced them:
   ?plant= wins, because a link that names a site is explicit; otherwise the
   last choice stands, which is what carries the choice from page to page;
   otherwise the first site there is. The answer is printed in the bar, so no
   page is ever showing a site it has not named. */
function siteNow(ids){
  const q=new URLSearchParams(location.search).get('plant');
  let last=null; try{ last=localStorage.getItem('enerops-plant'); }catch(e){}
  const id = ids.indexOf(q)>=0 ? q : (ids.indexOf(last)>=0 ? last : ids[0]);
  try{ localStorage.setItem('enerops-plant',id); }catch(e){}
  const el=document.getElementById('site-now'); if(el) el.textContent=id;
  return id;
}

/* ---------- which site ----------
   PSEL used to be a set, and empty meant "every plant" - an alarm desk watching
   a portfolio. It is a set of exactly one now, because the portal is on one
   site and this page is that site's log. What is open across the WHOLE fleet is
   a question the site overview answers, on the cards, beside the site each
   count belongs to. */
PSEL=[siteNow(PLANTS.map(function(p){ return p.id; }))];

/* ---------- time dropdowns ----------
   The hidden input is the value: everything else on the page asks the field
   for "HH:MM" and gets it, exactly as it did when this was a time input, so
   the query wiring never learns that the control changed. */
function wireTimePicks(){
  document.querySelectorAll('.tpick').forEach(function(box){
    const el=$(box.dataset.time);
    const bits={};
    function parts(){
      const m=/^(\d{1,2}):(\d{2})/.exec(el.value||'');
      return m?[+m[1],+m[2]]:[0,0];
    }
    function bit(k,n){
      const b=document.createElement('button');
      b.type='button'; b.className='tbit'; b.dataset.part=k;
      b.setAttribute('aria-label',k==='h'?'Hour':'Minute');
      const list=document.createElement('div'); list.className='tlist'; list.hidden=true;
      b.appendChild(list); box.appendChild(b);
      bits[k]={b:b,list:list,n:n};
      const api={close:function(){ if(!list.hidden){ list.hidden=true; b.classList.remove('open'); } }};
      b.addEventListener('click',function(e){
        e.stopPropagation();
        if(!list.hidden){ api.close(); return; }
        MSELS.forEach(function(m){ if(m!==api) m.close(); });
        const now=parts()[k==='h'?0:1];
        let h='';
        for(let i=0;i<n;i++) h+='<button type="button" value="'+i+'"'+(i===now?' class="on"':'')+'>'+pad(i)+'</button>';
        list.innerHTML=h; list.hidden=false; b.classList.add('open');
        const on=list.querySelector('button.on');
        /* snapped to whole rows: a list resting part way into one reads as a
           misprint even when nothing is beside it to be out of step with */
        if(on){
          const rows=list.querySelectorAll('button');
          const step=rows.length>1?(rows[1].offsetTop-rows[0].offsetTop):on.offsetHeight;
          list.scrollTop=Math.max(0,Math.round((on.offsetTop-list.clientHeight/2)/step)*step);
        }
      });
      list.addEventListener('click',function(e){
        e.stopPropagation();
        const t=e.target.closest('button'); if(!t) return;
        const p=parts();
        el.value=pad(k==='h'?+t.value:p[0])+':'+pad(k==='m'?+t.value:p[1]);
        paint(); api.close();
        el.dispatchEvent(new Event('change',{bubbles:true}));
      });
      MSELS.push(api);
    }
    function paint(){
      const p=parts();
      bits.h.b.firstChild.nodeValue=pad(p[0]);
      bits.m.b.firstChild.nodeValue=pad(p[1]);
    }
    bit('h',24);
    box.insertBefore(Object.assign(document.createElement('span'),
      {className:'tsep',textContent:':'}),bits.h.b.nextSibling);
    bit('m',60);
    /* the label text has to exist before paint() can rewrite it in place */
    bits.h.b.insertBefore(document.createTextNode(''),bits.h.list);
    bits.m.b.insertBefore(document.createTextNode(''),bits.m.list);
    paint();
  });
}
wireTimePicks();

/* The whole date field is the button that opens the calendar.

   A date input only reacts to a click on its 12px indicator glyph, so a click
   on the number - which is most of the control, and where anyone aims - did
   nothing. Three things have to be true for that to feel like a button:

     it TOGGLES      showPicker has no close, so the second click blurs instead,
                     which is what actually dismisses the native popup;
     no text select  preventDefault on mousedown stops the segment highlight, and
                     focus is then given back deliberately so typing still works;
     the flag is honest
                     the popup can close without us - a pick, an Escape, a click
                     elsewhere - so every one of those resets it, or the next
                     click would blur a picker that had already gone. */
function wireDatePickers(root){
  /* date AND time: one contract for both halves of the field */
  (root||document).querySelectorAll('input[type=date]').forEach(function(el){
    if(el.dataset.picker) return;
    el.dataset.picker='1';
    let open=false;
    const shut=function(){open=false;};
    el.addEventListener('blur',shut);
    el.addEventListener('change',shut);
    document.addEventListener('mousedown',function(e){ if(e.target!==el) shut(); },true);

    el.addEventListener('mousedown',function(e){
      /* the indicator already toggles itself; taking it over would fight it */
      if(e.offsetX>=el.clientWidth-26) return;
      e.preventDefault();                       /* no caret, no segment highlight */
      if(open){ el.blur(); open=false; return; }
      el.focus({preventScroll:true});
      if(el.showPicker){ try{ el.showPicker(); open=true; }catch(_){} }
    });
    el.addEventListener('keydown',function(e){
      if(e.key!=='Enter'&&e.key!==' ') return;
      e.preventDefault();
      if(open){ el.blur(); open=false; return; }
      if(el.showPicker){ try{ el.showPicker(); open=true; }catch(_){} }
    });
  });
}
wireDatePickers();

$('clk').textContent=fmtT(nowT(),true);
setInterval(function(){ $('clk').textContent=fmtT(nowT(),true); },1000);
$('refresh-sel').addEventListener('change',function(){

  $('livedot').style.animationPlayState=off?'paused':'running';

renderTable();

<!-- ======================= THE ROW, IN FULL =======================
     Hover a row and the whole of it is lifted out beside the pointer, so a table
     wider than the screen does not have to be read in two swipes. The labels are
     taken from the table's OWN header every time it opens - including the
     two-deck device/variable header, where a column is named by both decks - so
     a page that re-renders its columns can never label a value wrongly here. -->
<script>
(function(){
  const wrap=document.querySelector('.tablewrap');
  if(!wrap) return;
  const table=wrap.querySelector('table'), tbody=table&&table.tBodies[0];
  if(!tbody) return;

  const pop=document.createElement('div');
  pop.className='rowpop';
  document.body.appendChild(pop);

  /* Column names, read off the header as it stands. A header cell can span rows
     and columns, so the deck is laid out into a grid first and each column then
     reads down its own line - which is what turns "INV06" over "P_AC (kW)" into
     one name for one column. */
  function headerLabels(){
    const head=table.tHead; if(!head) return [];
    const grid=[];
    [].forEach.call(head.rows,function(tr,r){
      grid[r]=grid[r]||[];
      let c=0;
      [].forEach.call(tr.cells,function(cell){
        while(grid[r][c]!==undefined) c++;
        const rs=cell.rowSpan||1, cs=cell.colSpan||1;
        /* the sort arrow is a control, not part of the column's name */
        const txt=cell.textContent.replace(/[\u25b2\u25bc]/g,'').trim();
        for(let i=0;i<rs;i++){
          grid[r+i]=grid[r+i]||[];
          for(let j=0;j<cs;j++) grid[r+i][c+j]=txt;
        }
        c+=cs;
      });
    });
    const n=grid.reduce((m,g)=>Math.max(m,g.length),0), out=[];
    for(let c=0;c<n;c++){
      const parts=[];
      for(let r=0;r<grid.length;r++){
        const t=(grid[r]||[])[c];
        if(t&&parts[parts.length-1]!==t) parts.push(t);
      }
      out.push(parts.join(' \u00b7 '));
    }
    return out;
  }

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let row=null;

  function hide(){ pop.classList.remove('on'); row=null; }

  function fill(tr){
    const labels=headerLabels();
    const cells=[].slice.call(tr.cells);
    /* the "nothing here" row is one cell spanning the table - there is no
       reading to spell out */
    if(cells.length<2) return false;
    let body='';
    cells.forEach(function(td,i){
      const v=td.textContent.trim();
      body+='<span class="rp-k">'+esc(labels[i]||('Column '+(i+1)))+'</span>'+
            '<span class="rp-v'+(v==='\u2014'||v===''?' nil':'')+'">'+esc(v||'\u2014')+'</span>';
    });
    /* the first cell is the row's identity - its time stamp - so it heads the
       card rather than sitting in the list as one field among many */
    pop.innerHTML='<div class="rp-h">'+esc(cells[0].textContent.trim())+'</div>'+
      '<div class="rp-g'+(cells.length>9?' two':'')+'">'+body+'</div>';
    return true;
  }

  function place(e){
    const w=pop.offsetWidth, h=pop.offsetHeight;
    let x=e.clientX+20, y=e.clientY+18;
    if(x+w>window.innerWidth-10) x=e.clientX-w-20;   /* flip rather than overflow */
    if(y+h>window.innerHeight-10) y=Math.max(10,e.clientY-h-14);
    pop.style.left=x+'px';
    pop.style.top=y+'px';
  }

  tbody.addEventListener('mousemove',function(e){
    const tr=e.target.closest&&e.target.closest('tr');
    if(!tr||!tbody.contains(tr)){ hide(); return; }
    if(tr!==row){
      if(!fill(tr)){ hide(); return; }
      row=tr;
      pop.classList.add('on');
    }
    place(e);
  });
  tbody.addEventListener('mouseleave',hide);
  /* it is pinned to the pointer, so anything that moves the page under it makes
     it a lie */
  window.addEventListener('scroll',hide,true);
  window.addEventListener('resize',hide);
})();
</script>
</body>
